[project]
name = "fast-mcp-jobvite"
version = "0.1.0"
description = "An MCP server for the Jobvite ATS."
requires-python = ">=3.12"
license = "Apache-2.0"  # B89 SPDX id; README section deferred with B77
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "evolv Consulting" }]

# DESIGN.md:1497-1506 states this block verbatim at `fastmcp==4.0.0b4`
# plus an explicit `fastmcp-slim==4.0.0b4`, and ADR-0001 pins that beta.
# The design is FROZEN, so ADR-0036 is what changes it: 4.0 went GA on
# 2026-08-31 and 4.0.3 on 2026-09-05, and a GA pin resolves
# `fastmcp-slim` unnamed. MEASURED, both directions, in one `uv lock`
# battery: at 4.0.0b4 dropping the slim line still fails to resolve
# ("no version of fastmcp-slim[client]==4.0.0b4"), and at 4.0.3 it
# resolves clean at 121 packages with `fastmcp-slim` arriving at 4.0.3
# transitively. The comment that called the line load-bearing was true
# and is now false, so the line goes with it rather than surviving as a
# pin whose justification no longer holds:
# a GA pin resolves it unnamed; measured, not assumed
#
# `mcp` stays pinned explicitly. DESIGN.md:1486-1488's reason is
# untouched by the GA move: the ResponseLimiting regression arrived
# through the transitive SDK with zero change to the code that broke.
dependencies = [
  "fastmcp==4.0.3",
  "mcp==2.1.1",              # the transitive SDK that broke a middleware with no code change
  # U3's, and the dependency slot was serialised to add it (collision 10: uv.lock
  # regenerates whole, so two units adding a dependency conflict on the whole file).
  # DESIGN.md:302-303 forbids a custom logging module and names loguru as what
  # covers it, so a stdlib-logging seam written instead of this WOULD BE the
  # forbidden module. Threat row C7 (:1741) names it as a component.
  "loguru==0.7.3",
  # U4's, added under the same serialised dependency slot (collision 10). Both
  # were ALREADY resolved transitively in uv.lock at these exact versions, so
  # `uv lock` added only the direct entries and moved no version.
  #
  # httpx2 is ADR-0007's decision and the client FastMCP itself installs: fastmcp
  # 4.0.3 does not install `httpx` at all. Naming it directly rather than
  # relying on the transitive is deliberate - the Jobvite client imports it, and a
  # module that imports a package nobody declared breaks the day the intermediate
  # drops it. It also ships MockTransport in the box, which is what lets the
  # credential-free test strategy add NO third-party mocking library
  # (DESIGN.md:1440-1441).
  "httpx2==2.12.0",
  # DESIGN.md:349-352 makes HR-XML a HARDENED FALLBACK rather than a handled
  # case: it appears on /v1/candidate, which we do not call, and if XML ever
  # arrives it is parsed with defusedxml and treated as an error body. Entity
  # expansion on attacker-reachable input is not a risk worth taking for a route
  # that should never respond to us.
  "defusedxml==0.7.1",
  # U1's, and it was MISSING while config.py imported it directly. It arrives
  # transitively through fastmcp-slim, so the server ran perfectly on an
  # UNDECLARED dependency - the exact failure class the three pins above exist
  # for. A fastmcp bump that drops it breaks `from pydantic_settings import
  # BaseSettings` at import time, with nothing in the manifest to have stopped
  # it. Declared because we import it DIRECTLY, not because the resolve needs
  # the name. Found by impl-u1-boot after its unit had already merged.
  "pydantic-settings==2.15.0",
  # U7's, and both were added in one edit under the SAME serialised dependency
  # slot U3 and U4 used (collision 10: `uv lock` regenerates whole, so two units
  # adding a dependency conflict on the whole file).
  #
  # `tenacity` is DESIGN.md:359-361's retry mechanism - "retries live inside this
  # module, via tenacity with jitter, and only for connection errors, timeouts
  # and 5xx" - and STANDARDS.md:374-375 blesses `tenacity ^9`.
  "tenacity==9.1.2",
  # `circuitbreaker` is B37's one-breaker-per-dependency library and
  # STANDARDS.md:374-375 blesses `circuitbreaker ^2`. It is here rather than an
  # inline breaker BECAUSE IT WAS MEASURED, not because it is blessed:
  # DESIGN.md:677 requires half-open expiry to be evaluated ON THE CALL PATH
  # rather than by a background timer, since a ContextVar is per-Task and a
  # timer-fired expiry would log `request_id=None`. `circuitbreaker` 2.1.3
  # computes `state` as a pure property read on entry and imports no threading
  # or scheduling machinery at all - see scripts/probe-breaker-call-path.py,
  # which is the artefact of that rejection test and is run as a test.
  "circuitbreaker==2.1.3",
]

# U1's key, and only this key (IMPLEMENTATION-PLAN.md:1273). U0 deliberately
# omitted it because it names a function U1 writes.
[project.scripts]
fast-mcp-jobvite = "fast_mcp_jobvite.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_mcp_jobvite"]

[tool.uv]
prerelease = "explicit"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  # `docs/reviews/check-checkers-are-wired.py` parses the workflow YAML
  # rather than grepping it, because a grep counts a name in a COMMENT as
  # wired and that mislabelled four checkers here in one day.
  #
  # BOTH LINES ARE DELIBERATE. pyyaml was already resolvable as a
  # TRANSITIVE dependency of three other packages, which is why the
  # checker ran green locally and died in CI with ModuleNotFoundError:
  # relying on someone else's dependency is relying on a fact nobody
  # promised. types-PyYAML is what `mypy` needs; without it the Types job
  # fails on the import even when the import works.
  "pyyaml>=6",
  "types-PyYAML>=6",
  # COMPLIANCE-SPEC.md:194 requires this in dev and it was absent. The licence gate
  # worked only via `uv run --with pip-licenses`, which resolves it UNPINNED on every
  # run, outside uv.lock - so the tool auditing the frozen resolve was itself unfrozen,
  # which is the one property ci.yml builds two assertions to guarantee for everything
  # else. ADR-0015 also asserted it WAS a dev dependency; it was not.
  "pip-licenses>=5",
  # DESIGN.md's "CI must also run ... pip-audit" was satisfied by NOTHING: U11 built
  # scripts/check_advisories.py to emit pip-audit's --ignore-vuln flags, and no step
  # ran pip-audit, so the ignore mechanism was fully built and connected to nothing
  # while the dependency tree went unaudited. Declared here rather than reached via
  # `uv run --with pip-audit`, which resolves UNPINNED outside uv.lock - the exact
  # defect ADR-0015 records for pip-licenses one entry above.
  "pip-audit>=2.7",
  # C8-I1 is a CRITICAL row and DESIGN.md:1711-1724's two commit-time gates are its
  # stated mitigation. `.pre-commit-config.yaml` existed and pre-commit itself was
  # declared NOWHERE, so on a fresh clone `uv sync --frozen` produced an environment
  # in which the hooks could never install: the mitigation was in force only for the
  # machine that happened to have the tool. A control absent by default is worse than
  # no control, because the repository looks protected.
  "pre-commit>=3.7",
]

# ---------------------------------------------------------------------------
# Advisory-ignore table. Owned by U11 (scripts/check_advisories.py), landed empty
# here so U11 only ever edits rows inside it - IMPLEMENTATION-PLAN.md:920-922.
#
# DESIGN.md:1594-1604: an entry is legal ONLY for an advisory our code cannot
# reach, and only with an id, a date, a written unreachability reason, and an
# expiry no more than 30 days out. Never a blanket ignore, never a raised
# threshold. check_advisories.py reads this table, emits pip-audit's
# --ignore-vuln flags from it, and exits non-zero on any expired entry.
# ---------------------------------------------------------------------------
[tool.fast-mcp-jobvite.advisory-ignores]
entries = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# --strict-markers is not housekeeping here (DESIGN.md:1318-1323). This project's
# whole test strategy is "exclude the credentialed arm deliberately"; without it a
# typo in the exclusion marker's name selects nothing and the run goes green having
# tested less than it claimed.
#
# `-m "not credentialed and not network"` is the SELECTION that gives CI zero skips
# (DESIGN.md:1310-1313): a skip counts as a failure, so the excluded arms are
# deselected, never marked skipif. `-m` is last-wins, so a CI step passing its own
# -m overrides this.
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
  "-ra",
  "-m", "not credentialed and not network",
]

markers = [
  "credentialed: needs a real Jobvite credential. NEVER run in CI - deselected by the addopts above and collected with --collect-only so it cannot rot (DESIGN.md:1325-1330)",
  "network: needs outbound network. Deselected from the default offline suite; CI runs it as its own step",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
]

filterwarnings = [
  "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage. Floors are ADR-0010's, against backend/testing.md:82's branch = true.
# THE NUMBERS ARE NOT REPEATED HERE. They live in DESIGN.md's coverage sentence,
# and `docs/reviews/check-coverage-floors.py` parses them out of it - so a copy in
# this comment would be a second place to change a threshold and, on the evidence
# below, the place nobody would change.
#
# Only the overall floor is expressible as a single `fail_under`. THE PER-MODULE
# FLOORS ARE ENFORCED BY THAT CHECKER, over `coverage json`, and each critical-path
# module declares its own `COVERAGE_ROLE` so the checker joins rather than carries
# the list.
#
# THIS COMMENT USED TO SAY THEY WERE "enforced by the units that create those
# modules", which was an obligation with no enforcer. `fail_under` is 80 and the
# suite measures well above it, so `pytest --cov` stayed green while approval.py sat
# at 78.6% branch and tools/candidates.py at 80.8%, both against a 90% floor - and
# both misses were on BRANCH, which is not the half the terminal summary invites you
# to read. Task #94.
#
# WIRED. `ci.yml`'s Coverage step runs `pytest --cov`, and `fail_under` below is the
# floor it enforces. NO MEASUREMENT IS QUOTED HERE ON PURPOSE: this line used to
# carry "92.66% over 552 statements", and the statement count had nearly TRIPLED by
# the time anyone read it again. Run the checker; it prints the current figures.
#
# `--cov-fail-under` is deliberately NOT passed on that command line, so the floor
# lives in this file alone. Two places to change a threshold is one place to forget.
#
# This comment previously said the step was commented out and the package held only
# __init__.py. Both were false, and the DEFERRED list in ci.yml's header had gone
# stale in exactly the same way once before (the advisories entry, which U11 flagged
# and could not fix). A deferral note outlives the deferral unless deleting it is
# part of landing the thing.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/fast_mcp_jobvite"]
branch = true
# R2-M-8. `__main__.py` reads well below every other module here and the
# number is NOT the whole story: its shutdown handler, its transport
# selection and its `finally: os._exit` arm run OUT OF PROCESS.
# `test_boot.py` and `test_shutdown.py` drive them through
# `subprocess.run`/`Popen`, and no `parallel`, `sigterm`, `concurrency`
# or `COVERAGE_PROCESS_START` is set below, so the child's execution is
# not measured at all. The arms exist; the instrument does not see them.
#
# **Do NOT add an `omit` row for `__main__.py`.** That makes the number
# look right by measuring less, on the most safety-critical file in U1 -
# and it is the obvious "fix" for a reader who sees the figure and not
# the mechanism, which is why this comment is here instead of one.
#
# No figure is quoted on purpose. R2 filed this against 58%; it was 69%
# by the time anyone checked, and a per-module percentage in a comment
# is stale the next time a test lands. Run `pytest --cov` and read it.
#
# Wiring subprocess measurement is the real fix and is not done here: it
# needs `parallel = true`, a `COVERAGE_PROCESS_START` in the child
# environment and a `coverage combine` step in `ci.yml`, which is a CI
# change and not this branch's to make.
#
# `[tool.coverage.report]` below sets `fail_under = 80` and nothing
# enforces ADR-0010's per-module floors (tool modules 85, the client 90,
# utilities 95). That is a separate gap and it is still open.
omit = [
  "*/tests/*",
  "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
fail_under = 80
show_missing = true

[tool.ruff]
# 88, not 100. python.md:35 mandates it and COMPLIANCE-SPEC.md:513 lists
# `line-length = 100` as do-not-copy item 16, inherited from fast-mcp-jira.
# It was set here and never argued: a grep for line-length across DESIGN.md,
# the plan, every ADR, DECISIONS.md and the worklogs returns nothing.
line-length = 88  # B49: the code half (python.md:35)
target-version = "py312"

# MARKDOWN IS PROSE HERE, NOT SOURCE. Taking `extend-exclude = ["docs"]` off so
# ruff could finally read the wired checkers also switched on ruff's Markdown
# support, and `ruff format` then wanted to rewrite the Python code blocks
# INSIDE 17 documents - `docs/DESIGN.md` among them, which is FROZEN and whose
# blocks are quoted illustrations, not code that runs. Seven of its blocks would
# have been rewritten. The `.py` files under `docs/` stay fully linted AND
# formatted; only the documents are out.
src = ["src", "tests"]
extend-exclude = ["**/*.md"]

[tool.ruff.lint]
select = [
  # COMPLIANCE-SPEC.md:205-218 verbatim. Five [STD] families were missing and are
  # added here while src/ is one file - at U8 this becomes a whole-tree diff.
  "E", "W",   # pycodestyle       [STD] python.md:28
  "W505",     # doc-line-too-long [STD] python.md:36 (B49b). Listed even
              # though "W" covers it: W505 is INERT unless max-doc-length
              # is set, so naming it here keeps the pair visible together.
  "F",        # pyflakes          [STD] quality-gates.md:63
  "I",        # isort             [STD] python.md:54-58
  "N",        # pep8-naming       [STD] python.md:62-72 (B52)
  "D",        # pydocstyle        [STD] python.md:29
  "UP",       # pyupgrade         [REC]
  "B",        # bugbear           [REC] python.md:193-206
  "S",        # bandit            [REC] agentic-coding-standard.md:123-135
  "ASYNC",    # async correctness [REC]
  "DTZ",      # naive datetimes   [STD] python.md:227, no datetime.utcnow (B51)
  "T20",      # flake8-print      [STD] observability.md:642, no print statements
  "ANN",      # annotations       [STD] python.md:76, type hints required (B50 type-hint half)
]
ignore = ["D203", "D213"]   # mutually exclusive with D211/D212

[tool.ruff.lint.pycodestyle]
# B49b. `backend/python.md:36` - "For comments and docstrings: 72
# characters" - in a document whose frontmatter is `priority: required`.
# The clause was unenforced from U0 to here, and the violation count grew
# from 367 to 1608 in the days it went unmeasured. The rule ships in the
# SAME commit as the sweep so the gate is never knowingly red.
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "google"       # python.md:97 (B50 docstring half)

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101", "S603", "S607",  # asserts and subprocess are the point in a test
  "D103", "ANN",           # undocumented, unannotated tests are fine
  "N802",                  # test names use CAPS for emphasis, deliberately:
                           # test_the_gate_does_NOT_stop_confidential_prose_in_markdown
                           # pins a ceiling, and the capitals are load-bearing to a reader
]
# The gate script is a CLI: printing IS its interface, and its refusal message is
# the control being tested. T20 would forbid the thing the tests assert on.
"{scripts,docs/reviews}/**" = ["T201", "D103"]
# `docs/reviews/**` holds the wired CI gates and their probes. (No count here:
# three independent measurements of "how many are wired" disagreed - 19, 18 and
# 16 - because some are named only inside ci.yml COMMENTS and some are reached
# indirectly through a shell harness. The number is not load-bearing for this
# exemption, and a retyped constant is how the last four went stale.) It is the
# `tests/*` population living at another path, and it gets that population's
# exemptions for the same stated reasons: asserts and subprocess ARE the
# mechanism in a harness, and an unannotated probe helper is fine. Everything
# else applies - W505, E501, B, D, N, DTZ and the rest are enforced here, and
# the 1464 findings that were invisible while `extend-exclude = ["docs"]` stood
# have been swept rather than exempted.
"docs/reviews/**" = [
  "S101", "S603", "S607",  # asserts and subprocess are the point in a harness
  "ANN",                   # an unannotated probe helper is fine, as in tests/*
]

[tool.mypy]
python_version = "3.12"
strict = true
# R12-M2: `scripts` was in NEITHER the old list nor the docs-lint one. That
# commit's stated purpose was to let the type and lint gates read the wired
# checkers, and it brought in `docs/reviews` while leaving the other half of
# them out - scripts/check-harness-anchors.py (the 458-anchor floor),
# check_advisories.py (the dependency-audit flag source),
# check-committed-file-types.py, four probes and the two adr-batch one-shots.
# ruff already covered them (its exclusion is only `**/*.md`); the type gate
# did not.
#
# MEASURED BOTH WAYS AT THE TIME, because a nine-file addition reporting ZERO
# errors under `strict = true` is a suspiciously clean number. WHEN THIS LINE
# WAS ADDED the file count moved 96 -> 105 and there were exactly 9
# `scripts/*.py`. Both figures have since moved - 14 tracked `scripts/*.py` and
# a mypy population of 136 on 2026-09-02 - and they are LEFT IN THE PAST TENSE
# rather than refreshed: 105 - 96 = 9 is the ARITHMETIC that justified the
# change, so swapping today's numbers in would break the argument while looking
# like an update. #170 named this class - a historical justification inside a
# live file, where the remedy is tense and not arithmetic. An identical
# deliberate error appended
# to check-harness-anchors.py exits 0 before this line and 1 after it, and the
# same in probe-scan-bounds.py, so two separate files in the new population are
# demonstrably read. The zero is real: these were written annotated.
files = ["src", "tests", "docs/reviews", "scripts"]

# defusedxml ships no type information (no py.typed, no bundled stubs), so under
# `strict = true` its three imports in services/jobvite_client.py are hard errors.
#
# This is an OVERRIDE rather than a `types-defusedxml` dev dependency on purpose.
# U4's dependency slot was granted for two runtime packages and collision 10
# serialises edits to uv.lock across units; adding a stub package would resolve a
# new distribution into the lock for a typing convenience, which is a larger
# footprint than the problem. The narrow cost is recorded rather than hidden: the
# `fromstring` result is `Any` inside `_raise_from_markup`, so the element walk
# there is unchecked. Every value taken off it is re-typed explicitly at the call
# site, and the entity-bomb and well-formed-XML cases in
# tests/test_jobvite_client.py cover the branch behaviourally.
[[tool.mypy.overrides]]
module = ["defusedxml.*"]
ignore_missing_imports = true

# circuitbreaker 2.1.3 ships no `py.typed` and no bundled stubs either, so under
# `strict = true` U7's one import of it is a hard error for the same reason
# defusedxml's three are. There is no `types-circuitbreaker` on PyPI to weigh
# against this, so the override is not a choice between two options - it is the
# only one. `tenacity` is NOT listed: it ships `py.typed` and type-checks.
#
# THE NARROW COST, recorded rather than hidden. `CircuitBreaker` and
# `CircuitBreakerError` are `Any` inside services/jobvite_client.py, so
# `_JOBVITE_BREAKER.state`, `.opened`, `.failure_count`, `.open_remaining` and
# `.reset()` are unchecked attribute reads: a `circuitbreaker` bump that renames
# one of them is a runtime `AttributeError`, not a mypy error. Every one of them
# is exercised by a case in tests/test_resilience.py, and the breaker's
# call-path property - the one that made it adoptable at all - is asserted by
# scripts/probe-breaker-call-path.py, which the same suite runs.
[[tool.mypy.overrides]]
module = ["circuitbreaker.*"]
ignore_missing_imports = true

