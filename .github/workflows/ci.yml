name: CI

# U0. Before this file existed, every gate in DESIGN.md was hand-run and every
# "CI runs X" sentence in the design was a specification rather than a report
# (DESIGN.md §10's "No CI pipeline exists yet"). This workflow is what turns those sentences true.
#
# WHAT HAS AND HAS NOT BEEN EXECUTED, stated here because the alternative is a
# workflow that reads as tested and is not:
#
#   EXECUTED locally on 2026-08-28 (uv 0.11.3, Python 3.12.3), exact commands and
#   real output in docs/worklogs/U0-REPORT.md:
#     uv sync --frozen / uv lock --check / ruff check / ruff format --check / mypy
#     pytest (default, network and --collect-only arms) / the three coupling gates
#     scripts/check-u0-test-controls.sh / pip-licenses / cyclonedx-py
#
#   FIRST EXECUTED in green run 33582613697 (2026-09-02) - GitHub-hosted actions
#   that cannot run on a developer machine, so that run was their first evidence:
#     codeql / trufflehog / sbom (anchore). They are written to the standards'
#     pinned versions and their first real run is their first evidence.
#     The `Lint the workflows` step joins them WITH ONE DIFFERENCE worth
#     recording: the TOOL has been run here, on this tree, at the same
#     version and the same SHELLCHECK_OPTS, with a positive control - 0
#     findings, and re-introducing R3-H1's job-level `if:` produces the
#     expected error and exit 1. What is unexecuted is the STEP: the
#     `uses: docker://` invocation and its arg passing. That is a smaller
#     unknown than the three above, and it is still an unknown.
#
#   DEFERRED with an owning unit, NOT silently omitted:
#     scripts/check_advisories.py -> LANDED by U11 (f4f69f9). The step runs and
#       enforces the expiry half. This entry stayed here saying "the script does
#       not exist" after it did, which U11 flagged and could not fix - :1365
#       gives it its own block and nothing else.
#     pip-audit ITSELF -> STILL DEFERRED, and this is the sharper gap. The design
#       requires it and NO step runs it, so check_advisories.py emits
#       --ignore-vuln flags that NOTHING CONSUMES: the ignore mechanism is fully
#       built and connected to nothing, and the dependency tree is not audited.
#       Blocked on the serialised dependency slot (collision 10). Tracked as #26.
#       NEVER `uv run --with pip-audit` - that resolves unpinned outside the lock,
#       which is exactly the defect ADR-0015 records for pip-licenses.
#     fastmcp inspect capability-drift diff -> U1 (`fastmcp inspect` takes a
#       server spec; server.py is U1's file). Note DESIGN.md §10's "reasoning, not an executed result": standing
#       this up in CI does NOT execute it. A diff that has never seen a real
#       capability change has only ever compared a build to itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # WEEKLY SECURITY SWEEP - ci-cd.md:455-456, COMPLIANCE-SPEC.md:45 [STD].
  # Every other trigger here fires on a CHANGE. CodeQL, TruffleHog and the
  # licence gate therefore only ever see the tree on the day someone pushes, and
  # an advisory published against the PINNED BETA STACK after the last merge is
  # invisible until the next one. This repo pins a beta deliberately (ADR-0001),
  # which is precisely the case the schedule exists for.
  #
  # Every job runs on the sweep, not only the security ones. `uv lock --check`
  # and the network arm catch resolve rot on the same cadence for free, and a
  # weekly full green says more than a weekly partial one.
  schedule:
    - cron: '0 0 * * 0'   # Sundays 00:00 UTC

# The event name is IN THE GROUP KEY on purpose. Without it a scheduled sweep
# and a push to main share the group `ci-refs/heads/main`, and with
# cancel-in-progress the two cancel each other - a security sweep that never ran
# looks identical to one that was never scheduled. Keyed per event they cannot
# collide, and cancel-in-progress still does its real job of superseding an
# outdated run of the SAME event ON A BRANCH - see below, it no longer applies
# to `main` at all.
# CANCELLING IS RIGHT FOR A BRANCH AND WRONG FOR THE TRUNK. On a busy branch
# the newest push is the only one anyone cares about. On `main` the RUN IS THE
# RECORD, and a cancelled run leaves none: measured 2026-08-29, main had 54
# cancelled runs, 5 failures and ZERO successes in a day, and because a
# `cancelled` conclusion is not a failure, nothing anywhere read as red while
# the trunk had been broken for hours. Every push simply cancelled the evidence
# that the previous one was broken.
#
# So main's RUNNING run is never cancelled, and every other ref still
# cancels. **This does NOT mean every commit to main gets a run.** Measured
# after the change: GitHub keeps at most ONE PENDING run per concurrency
# group and cancels older queued ones regardless of this setting - two such
# runs were cancelled with `total_count: 0` jobs, having never scheduled a
# runner. What this buys is that the trunk always has a run that will REACH
# A CONCLUSION, where before it had 54 cancellations and none. A commit can
# still land with no run of its own; that is a smaller problem than a trunk
# with no record at all, and it is a known one rather than a surprise.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.3"
  PYTHON_VERSION: "3.12"

# -----------------------------------------------------------------------------
# THE THREE TIERS (#294). Read this before adding a job.
# -----------------------------------------------------------------------------
#
#   GATE       `test`                every push and every pull request. One job.
#                                    Lint, format, types, the suite, the
#                                    coverage floor and the static checkers.
#                                    This is the job a branch-protection rule
#                                    should require, and the only one that runs
#                                    on a pull request.
#
#   MERGE      `static-gates`        `github.event_name != 'pull_request'`, so:
#              `codeql`              push to `main`, the weekly sweep, and a
#              `changes`             manual dispatch. Supply chain, licences,
#                                    links, CodeQL, and the path classifier the
#                                    assurance tier reads.
#
#   ASSURANCE  `harness-assurance`   the weekly cron, a manual dispatch, and a
#                                    push to `main` that `changes` classifies
#                                    as code. ONE job, SERIAL, every harness
#                                    and every probe.
#
# WHY THE TIERS ARE JOBS IN ONE FILE RATHER THAN THREE FILES. Three workflows
# would express the triggers more directly - `on: push: paths:` is native and
# a job-level `if` cannot see paths at all. It was refused for three reasons,
# each of them a thing that would silently break:
#
#   1. `docs/reviews/check-row-floors.py` and `check-row-floor-exactness.py`
#      read `--min-rows` out of THIS FILE by path. Harness steps in another
#      file are floors those two cannot see, and a floor nothing reads is a
#      floor that has been retuned to zero without anyone typing a digit.
#   2. `scripts/check-mirror-liveness.py` watches EVERY SCHEDULED WORKFLOW in
#      `.github/workflows` and calls a workflow with no runs NEVER RUN, exit 2.
#      A second `schedule:` therefore turns the trunk red until the day it
#      first fires - a red for something no commit contains.
#   3. `docs/reviews/probe-ci-checker-steps.py` and
#      `probe-control-restore-guard.py` both pin this path.
#
# The cost of that choice is the `changes` job: one extra billed minute per
# push to `main`, buying the path discrimination `on: paths:` would have given
# free. It is a job rather than a filter BECAUSE a filter cannot tell
# `docs/reviews/*.py` (checkers) from `docs/reviews/*.md` (records).
#
# WHAT IS DELIBERATELY NOT HERE: a `paths-ignore:` on the workflow, and in
# particular not `'**/*.md'`. Markdown is not inert here. It was MEASURED
# rather than assumed, on a clean worktree at `3c0d648`, in both directions:
# deleting `JOBVITE_COMPANY_ID` from README.md's Quickstart block - a
# README-ONLY edit, no code touched - takes `The README's Quickstart still
# works` from exit 0 to exit 1, because that step EXECUTES the README.
# The negative arm matters just as much and is the reason this paragraph is
# careful: APPENDING a second fenced block to the same file changed nothing,
# rc=0 both times, because the checker reads the Quickstart block and not the
# prose. So the true statement is narrow - SOME markdown edits redden a wired
# gate, and a blanket `.md` filter cannot tell which - and it is not the only
# route: `docs/reviews/check-brief-report-references.py` rglobs every `.md`
# under the briefs tree, the lychee step walks the whole checkout, and the
# design- and standards-citation gates read `.md` prose for line-anchored
# citations. What a filter would buy is the suite's share of one job; what it
# would cost is a gate that is off and looks on, which is the failure mode
# that hid 119 red runs on this repository. The trade is refused.
jobs:
  static-gates:
    name: Merge - static gates, supply chain and links
    runs-on: ubuntu-latest
    # MERGE TIER (#294). Not on a pull request: every step below either scans
    # the tree for something a commit-time hook already refuses on the push
    # path (secrets, file types, shellcheck), or reads the supply chain, which
    # changes when a lock file lands rather than when a branch is edited.
    # Keeping it off the PR path takes it out of the per-push bill without
    # taking it off `main`, which is the ref a release is cut from.
    #
    # `github.event_name` only - never `secrets`, which GitHub does not
    # provide in this position and which failed to evaluate silently for 119
    # consecutive mirror runs (R3-H1). A job-level `if` that cannot be
    # evaluated does not fail; it produces a run with zero jobs.
    if: github.event_name != 'pull_request'
    # UNCAPPED WOULD MEAN SIX HOURS - observed max 148s for the merged work
    # (modelled from per-step timings; the three jobs' own maxima were 34s, 39s
    # and 126s). 6x headroom.
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # `actions: read` is for the mirror-liveness step at the end of this job,
      # which reads the mirror workflow's `state` and its most recent run from
      # the Actions API. Read-only, and the narrowest scope that call accepts.
      actions: read
    steps:
      # fetch-depth 0: the freeze gate resolves the SHA in docs/DESIGN-FREEZE.txt,
      # which a SHALLOW clone does not contain - it failed in CI with 'invalid
      # object name' while passing locally, because a local clone has history and
      # actions/checkout defaults to depth 1. The Supply-chain job already carries
      # this reasoning for TruffleHog; I did not apply it to a gate that needs the
      # same thing.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # THIS JOB NEEDS THE DEPENDENCIES, and for one non-obvious reason.
      # Most steps here are pure-stdlib checkers, which is why the job ran
      # without a sync for so long. But `check-plan-measurements.py` RE-RUNS
      # measurements, and two of its four probes invoke pytest. It selects
      # `.venv/bin/python` when that exists and falls back to `sys.executable`
      # otherwise - so with no sync it silently ran the probes under the
      # hosted-toolchain interpreter, which has no pytest, and the step failed
      # for a reason that looks nothing like its subject.
      #
      # The fallback is not the defect: a checker that degrades to the ambient
      # interpreter is right for a developer machine. The defect was a job that
      # runs a pytest-dependent checker without the environment it needs.
      - name: Install from the frozen lock
        run: uv sync --frozen

      # WORKFLOW LINTING. Nothing lint this file until now, and the cost of
      # that was 119 consecutive silent failures: mirror.yml used `secrets`
      # in a job-level `if:`, a context GitHub does not provide there, so
      # every run died at expression evaluation with zero jobs. actionlint
      # names that defect exactly - "context \"secrets\" is not allowed here"
      # - and would have caught it the day it was written (R3-H1, task #22).
      #
      # MEASURED BEFORE WIRING, on this tree: 0 findings, and the positive
      # control fires - re-introducing the job-level `if:` produces the
      # message above and exit 1. A gate wired without that control is a
      # gate nobody has seen work.
      #
      # SHELLCHECK_OPTS matches the threshold `bash.md:741,767` specifies
      # for ITSELF. actionlint runs shellcheck over every `run:` block, and
      # at the default threshold it reports one SC2015 (info) on the
      # credentialed-collect step - `[ -n "$n" ] && [ "$n" -ge 4 ] || {...}`,
      # where both operands are pure predicates so the idiom is correct.
      # Using the standard's own threshold keeps the two halves of that
      # standard - scripts and workflows - gated at one severity rather
      # than two. Task #33 covers what a stricter setting would find.
      # Downloaded and CHECKSUMMED rather than `uses:`. The action forms all
      # resolve a tag, and `tests/test_workflow_pins.py` refuses an action
      # with no `@ref` - it caught `docker://rhysd/actionlint:1.7.7` on the
      # commit that added this step, which is the pin gate working on its
      # author. A pinned tarball plus a sha256 is what `bash-standard` used
      # for shellcheck, so the two tools are acquired the same way.
      - name: Lint the workflows
        run: |
          set -euo pipefail
          ver=1.7.7
          sha=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          url=https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz
          curl -fsSL "$url" -o /tmp/actionlint.tgz
          echo "${sha}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          SHELLCHECK_OPTS=--severity=warning /tmp/actionlint -no-color

      - name: Coupling gate
        run: python3 docs/reviews/check-coupling.py docs/DESIGN.md

      # WIRED THE DAY IT WENT GREEN, and not before. It exits 0 now that
      # docs/DESIGN-FREEZE.txt names 5d17cd7; it exited 1 against the stale
      # aca9397, printing what had moved, and exits 2 on an empty
      # declaration rather than comparing nothing and passing.
      #
      # It exists because the freeze pointer and the design came apart for
      # a full day and no gate asked. The edit happened to replace one line
      # in place, so every line-numbered citation still resolved - had it
      # inserted a line they would all have been one off, resolving and
      # wrong. Benign by luck is the argument for the gate, not against it.
      - name: The design at its declared freeze is the design on main
        run: python3 docs/reviews/check-design-freeze.py

      # WIRED THE DAY IT WENT GREEN. No tracked .sh enables errexit;
      # a planted `set -euo pipefail` in a tracked script exits 1, and the
      # one dynamic `set` in probe-set-e-vs-harness.sh is correctly NOT
      # flagged.
      #
      # It exists because this invariant had been hand-measured three times
      # (2d20ed6, 5eb64b0, review R10) and recorded nowhere a machine could
      # check. Every harness timeout arm is `cmd; rc=$?`, which errexit
      # makes unreachable - the same defect as the sixteen dead CI branches
      # at 3ee39e5.
      - name: No harness enables errexit
        run: python3 docs/reviews/check-no-errexit.py

      # WIRED WITH #284, GREEN WHEN WIRED. At 99ebf05 this gate reported 48
      # fixed /tmp paths across 28 tracked .sh; after the sweep it reports
      # one, and that one carries its reason in DELIBERATE.
      #
      # THIS IS THE ONLY QUESTION CI CAN ASK ABOUT THIS DEFECT. Two worktrees
      # on one machine running one harness open the SAME INODE, and grep then
      # reports "binary file matches" on stderr with an EMPTY capture at exit
      # 0 - #262's false kill was assembled from another process's bytes that
      # way. The runner has ONE checkout, so the collision cannot occur there
      # and no green harness run will ever reveal its return. The static shape
      # is checkable; the race is not.
      #
      # `--self-test` is a SEPARATE step and not chained with `&&`: this job
      # does not run under errexit, so a chained self-test failure would be
      # invisible - measured three times in this file.
      - name: No shell script names a fixed /tmp path (self-test)
        run: python3 docs/reviews/check-no-shared-tmp-paths.py --self-test

      - name: No shell script names a fixed /tmp path
        run: python3 docs/reviews/check-no-shared-tmp-paths.py

      # WIRED 2026-09-01, GREEN WHEN WIRED: 37/37 scripts in the container
      # source the emitter, chain it from their EXIT trap, and call
      # harness_result_ran. Its controls sibling fires 8/8.
      #
      # IT HAD NEVER RUN IN CI. #107 landed "37 of 37 emit one canonical
      # line" and the checker that verifies that claim was invoked only by
      # hand - named in a worklog and one comment, nowhere a job could
      # reach. Found by check-checkers-are-wired.py below, on its first run.
      - name: Every harness emits the canonical HARNESS-RESULT line
        run: bash docs/reviews/check-harness-result.sh

      # THE DURABLE FIX for a defect that recurred with the same wrong
      # instrument. Three checkers here were written, measured, committed
      # and never wired; nothing said so, and they were cited as gates.
      #
      # `grep basename ci.yml` counts a name in a COMMENT as wired - a
      # reviewer mislabelled three files with it and I mislabelled a fourth
      # the same day. So this parses jobs.*.steps[].run out of the YAML and
      # strips shell comments before matching.
      #
      # Unwired is allowed; unwired AND unrecorded is not. It also refuses
      # an exemption naming a checker that IS wired, because a reason that
      # outlives its condition is how a list stops describing its subject.
      # `uv run`, NOT bare `python3`, and it is the ONLY step in this job
      # that needs it. Every other checker here is stdlib-only, so the
      # family convention is `python3` - and I followed the convention
      # into a red trunk. This one imports `yaml` to parse the workflow,
      # my local `python3` happened to have pyyaml, the runner's did not,
      # and it died with ModuleNotFoundError on the commit that wired it.
      # I had tested it with `uv run` and shipped it as `python3`.
      # #153/#155/#149: the container is now every tracked `.py`/`.sh`
      # under docs/reviews/ AND scripts/, selected by KIND. It used to be
      # `docs/reviews/check-*`, which is a name prefix wearing a
      # container's name: it saw 28 of 123 files and printed "Every
      # checker is wired" about the other 95.
      - name: Every checker is wired, or says why it is not
        run: uv run --frozen python docs/reviews/check-checkers-are-wired.py

      # THE CHECKER'S OWN CONTROLS, WIRED (#149 M-3). They were 26
      # hand-run controls guarding the file that exists to prove things
      # are not hand-run - the founding defect, one level up, in the
      # instrument built to catch it. Green at the moment of wiring, per
      # this repo's rule that a gate must never ARRIVE red.
      #
      # A SEPARATE STEP, not `&&`-chained onto the run above: under
      # `bash -e` only the LAST command of an AND-list triggers errexit,
      # so a chained self-test failure would be invisible. Measured three
      # times in this repository.
      - name: The wiring checker's own controls still fire
        run: |
          set -euo pipefail
          uv run --frozen python \
            docs/reviews/check-checkers-are-wired.py --self-test || exit 1

      # #153's ruling, and the step suborch-116 wrote and measured. This
      # checker was COMMITTED UNWIRED by the very task that built it, and
      # the wiring gate could not see it because it lives under
      # `scripts/`. Widening the container makes it visible; this step is
      # the other half, and both land together so the gate is never red.
      #
      # Both arms `|| exit 1` rather than chained, for the errexit reason
      # above.
      - name: No abort message retypes a seconds figure
        run: |
          set -euo pipefail
          uv run --frozen python scripts/check-timeout-literals.py --self-test || exit 1
          uv run --frozen python scripts/check-timeout-literals.py || exit 1

      # WIRED THE MOMENT IT WENT GREEN, which is the whole discipline: it
      # was held back by a stated exemption while the 47 blank-END
      # citations were swept (#126), and wired in the commit after that
      # sweep landed. A gate that arrives red is one people learn to
      # ignore - this repo has proved that twice.
      #
      # ITS ZERO IS NOT VACUOUS, and `--controls` is how you know: 7/7
      # controls fire, including the blank-END detector that found the 47.
      # A green from a detector nobody has watched fire is a green that
      # tested nothing.
      #
      # IT DOES NOT PROMISE MORE THAN IT CHECKS, and says so in its own
      # output: it finds citations pointing at something that CANNOT be
      # their subject. A citation landing on real prose can still name the
      # wrong sentence - five have been found here by reading (#114), and
      # the sweep above caught a sixth that a mechanical trim would have
      # created.
      - name: Design citations have a plausible shape
        run: python3 docs/reviews/check-design-citation-shape.py

      # WIRED 2026-09-01, both green when wired, both measured first. They had
      # been sitting UNWIRED while appearing in this file only inside comments,
      # which is why a naive `grep basename ci.yml` reported them as wired -
      # mine did, and so did a reviewer's. The population is now derived by
      # parsing jobs.*.steps[].run out of the YAML.
      #
      # NEITHER PROMISES MORE THAN IT CHECKS, and each says so in its own
      # output: the clause checker proves a citation RESOLVES, not that it
      # names the right subject - the instances found so far are enumerated
      # in docs/reviews/WRONG-SUBJECT-REGISTER.md, and the count is derived
      # from its rows rather than written here - and the
      # env-var checker matches LITERALS, so a name built by composition is
      # invisible to it.
      # I WIRED THIS AFTER MEASURING IT GREEN LOCALLY, WHICH WAS NOT
      # ENOUGH. It reads the standards corpus - a PRIVATE sibling repo
      # that exists beside my checkout and on no runner - so it exits 2
      # ("this measurement did not run") in CI and turned the trunk red
      # within minutes of being wired. `check-standards-citations.py`
      # already had exactly this treatment; I did not carry it across.
      #
      # rc 2 is the CONFIGURED state, not a pass and not a failure. It is
      # announced loudly so it can never read as a green, which is the
      # switched-off-must-not-look-like-broken rule (#106).
      - name: Standard clause citations resolve
        run: |
          set +e
          out=$(python3 docs/reviews/check-clause-citations.py 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -eq 2 ]; then
            echo "::warning::THE CLAUSE-CITATION GATE DID NOT RUN. The standards"
            echo "         corpus is a private sibling repository this runner"
            echo "         cannot read. CONFIGURED state, not a failure - and"
            echo "         not a green: no clause citation was checked."
            echo "         Fix: STANDARDS_TOKEN, then a checkout of it (#106)."
            exit 0
          fi
          exit "$rc"

      - name: Every env var is declared
        run: python3 docs/reviews/check-env-vars-are-declared.py

      # Wired the day it went green, and not one commit before. It exited 1 on
      # exactly one finding - DESIGN.md §5.3's `SS5.4`, a section that does not
      # exist - and was deliberately left unwired, because a knowingly red gate
      # trains everyone to ignore the gate. ADR-0019 fixed the finding and this
      # step lands in the same commit.
      #
      # It has already earned its place: the ADR batch introduced a NEW unresolved
      # reference (an "RFC 9457 SS4.2.1" whose filename sat on the previous line,
      # so the checker read it as internal), in the very commit that fixed the
      # original one. Nothing else would have caught that.
      # EVERY DECLARED SETTING IS CONSUMED BY SOMETHING. Added after the
      # question "does anything READ this?" produced two findings in one day
      # and no gate here asked it: DESIGN.md §4.3's outbound budget was
      # unimplemented until U7, and `outbound_rate_limit` is STILL read by
      # nothing - declared, typed, defaulted, documented in .env.example and
      # covered by config tests, every one of which passes on a setting no
      # code consumes.
      #
      # A declared-and-unread setting is worse than a missing one: a missing
      # setting fails loudly at first use, while a declared one ships in
      # .env.example, an operator sets it, and it silently does nothing -
      # and server.json advertises it to registry consumers as a knob.
      #
      # WIRED GREEN. `outbound_rate_limit` is exempted with ADR-0025 as its
      # reason, and a stale exemption - a field that becomes read - fails
      # too, so the exemption cannot outlive its cause.
      - name: Every Settings field is consumed by something
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          out=$(python3 docs/reviews/check-settings-are-read.py 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::a declared setting is read by nothing, or an exemption is stale"
            exit 1
          fi

      # STANDARDS CITATIONS RESOLVE. A third citation population, and it had
      # no instrument until now: check-design-citation-shape.py reads only
      # DESIGN.md:N, and check-clause-citations.py reads only OBLIGATIONS.md's
      # CLAUSE column. The inline `<standard>.md:N` citations in src/, tests/
      # and scripts/ were unchecked, and 13 of 88 were wrong - a higher rate
      # than either DESIGN.md population.
      #
      # WIRED NOW THAT IT IS GREEN, which is this project's standing sequence.
      # Two of its findings were a class the others cannot produce: a BARE
      # basename that resolves in two directories - `error-handling.md` exists
      # under backend/ AND frontend/ - which is not a wrong citation but an
      # unresolvable one, and both targets are real so nothing looks wrong on
      # arrival. The checker REFUSES an ambiguous basename rather than taking
      # the first match.
      #
      # It exits 2, never 0, when the standards checkout is absent: a checker
      # that reports all-clear because it could not find its subject has
      # checked nothing.
      # THE CORPUS IS A PRIVATE SIBLING REPOSITORY AND CI CANNOT READ IT.
      # `evolvconsulting/evolv-coder-standards` is private, `GITHUB_TOKEN` is
      # scoped to this repository, and no step here checks it out - so on a
      # runner the checker finds no corpus and exits 2, BY DESIGN, because a
      # checker that reports all-clear when it cannot find its subject has
      # checked nothing. Verified by reproduction: `git archive HEAD` into a
      # directory with no sibling prints "CORPUS ABSENT ... Exiting 2".
      #
      # This step therefore had NEVER passed on a runner. It cannot until a
      # `STANDARDS_TOKEN` secret exists, which only the repository owner can
      # create. `MIRROR_TOKEN` used to be the sibling example on this line and no
      # longer is: the mirror's credential became `MIRROR_SSH_KEY` on 2026-09-04,
      # and HOW it was created is the part worth carrying here - a write DEPLOY
      # KEY can be minted through the API, where a PAT cannot. Whether that route
      # is open to `STANDARDS_TOKEN` turns on how many repositories it must read;
      # if the answer is one, it is.
      #
      # SO IT NOW STATES WHICH OF THE TWO STATES IT IS IN, and that is the
      # whole point. A gate that is red for a reason nobody on the team can
      # fix trains everyone to ignore CI, which this repository has already
      # paid for once: 119 consecutive red mirror runs went unread because
      # "inert" and "broken" rendered identically. Absent corpus is reported
      # loudly in a GREEN run; a corpus that IS present is gated exactly as
      # before. Both arms were run locally before this landed.
      - name: Standards citations resolve
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          out=$(python3 docs/reviews/check-standards-citations.py 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -eq 2 ]; then
            echo "::warning::THE STANDARDS GATE DID NOT RUN. The corpus is a private"
            echo "         sibling repository this runner cannot read. This is the"
            echo "         CONFIGURED state, not a failure, and it is not a green"
            echo "         either - nothing about standards citations was checked."
            echo "         Fix: a STANDARDS_TOKEN secret with read access to"
            echo "         evolvconsulting/evolv-coder-standards, then a checkout"
            echo "         of it and EVOLV_STANDARDS pointed at its standards/ dir."
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::a standards citation cannot be its subject"
            exit 1
          fi

      - name: Section cross-references resolve
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          out=$(python3 docs/reviews/check-cross-references.py 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::a SSn.m reference does not resolve in its own document"; exit 1
          fi
          # Selector control: a green over zero references means nothing. The
          # count is not hard-coded - it grows with the documents - but it must
          # not be zero, which is what a broken heading parser would produce.
          grep -qE '[1-9][0-9]* references' <<< "$out" || {
            echo "::error::the checker found no references at all; its green means nothing"; exit 1; }

      # ASSERT THE EXIT CODE AND THE "ALL FIRED" PROPERTY, NEVER A LITERAL COUNT.
      # This harness has reported 21, 32 and 34 to three readers in one day
      # (IMPLEMENTATION-PLAN.md:243-248). A hard-coded number turns the harness
      # GROWING into a red build, which is the opposite of what it is for. So the
      # check is that the numerator equals the denominator, whatever they are.
      - name: Coupling controls, all fired
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          out=$(python3 docs/reviews/check-coupling-controls.py 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::the controls harness exited $rc"; exit 1
          fi
          # "<n>/<m> controls fired." - required: n == m, and m > 0.
          line=$(printf '%s\n' "$out" | grep -oE '[0-9]+/[0-9]+ controls fired\.' | tail -1)
          if [ -z "$line" ]; then
            echo "::error::the harness did not report an 'N/M controls fired.' line at all"; exit 1
          fi
          fired=${line%%/*}
          rest=${line#*/}; total=${rest%% *}
          echo "parsed: $fired fired of $total held"
          if [ "$total" -eq 0 ]; then
            echo "::error::the harness holds zero controls; a green from it means nothing"; exit 1
          fi
          if [ "$fired" -ne "$total" ]; then
            echo "::error::$fired of $total controls fired; every control must fire"; exit 1
          fi
          # DESIGN.md's own requirement: a clean post-run re-check of the real file.
          grep -q 'post-run re-check of the real DESIGN.md: exit=0' <<< "$out" || {
            echo "::error::the harness did not leave DESIGN.md green"; exit 1; }

      # The obligations map, wired. It was built to stop obligations decaying and
      # then run only by hand for two days, which makes it exactly the thing it
      # exists to prevent: a control nothing enforces. Round 7 found it unwired.
      # This is the SECOND time on this repository - the file-type gate's `--all`
      # mode had no CI step either, one artifact earlier - so the lesson is not
      # "remember to wire it" but "a control that is not wired is not a control".
      #
      # Its anchors point into pyproject.toml, ci.yml, .env.example and
      # CONTRIBUTING.md, which U1, U5, U11, U13 and U15 all edit. It decays the
      # moment those units land, which is precisely why a hand-run green was
      # never a gate.
      - name: Obligation anchors still resolve to their subjects
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          out=$(python3 docs/reviews/check-obligations.py 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::an obligation anchor no longer contains its subject"; exit 1
          fi
          # Selector control: the script treats parsing zero rows as a failure,
          # but assert the population is non-empty here too rather than trusting
          # a green whose sample size nothing states.
          grep -qE 'Mappings: [1-9][0-9]*' <<< "$out" || {
            echo "::error::the checker parsed no mappings; its green means nothing"; exit 1; }

      # And its own controls arm, because the checker is itself a measuring
      # instrument and nothing else measures it. Round 7 recorded that it had run
      # only the default arm - a gate whose controls nobody runs is the same
      # class of green as a gate nobody wired.
      - name: Obligation checker controls, all fired
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          out=$(python3 docs/reviews/check-obligations.py --controls 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::the obligations controls harness exited $rc"; exit 1
          fi
          line=$(printf '%s\n' "$out" | grep -oE '[0-9]+/[0-9]+ controls fired\.' | tail -1)
          if [ -z "$line" ]; then
            echo "::error::no 'N/M controls fired.' line; the harness proved nothing"; exit 1
          fi
          fired=${line%%/*}
          rest=${line#*/}; total=${rest%% *}
          echo "parsed: $fired fired of $total held"
          if [ "$total" -eq 0 ] || [ "$fired" -ne "$total" ]; then
            echo "::error::$fired of $total controls fired; every control must fire"; exit 1
          fi
          # The NEGATIVE controls must exist and be tolerated. A wrongly-fired
          # one already makes the harness exit non-zero, but DELETING the
          # negative list would not: it would print a clean "N/M controls
          # fired." and exit 0. That is the unwired-control shape this repo has
          # been bitten by six times, so the section is asserted, not assumed.
          grep -q 'negative controls' <<< "$out" || {
            echo "::error::the harness ran no negative controls, so the guarantee"
            echo "::error::that line drift does not matter is untested"; exit 1; }
          grep -qE '^  tolerated ' <<< "$out" || {
            echo "::error::no negative control was tolerated: either none ran, or"
            echo "::error::the checker has gone back to matching line numbers"; exit 1; }
          grep -q 'post-run re-check of the real OBLIGATIONS.md: exit=0' <<< "$out" || {
            echo "::error::the harness did not leave OBLIGATIONS.md green"; exit 1; }

      # The plan's own measurements, re-run rather than re-read. Four decisions
      # in IMPLEMENTATION-PLAN.md rest on probes run once by hand and written up
      # in prose, and prose about a measurement decays into a CLAIM about one -
      # the next reader inherits the conclusion without the evidence. Rounds 6
      # and 7 each re-ran some by hand and reproduced them, which is the right
      # instinct and the wrong mechanism: it does not scale past the reviewer who
      # happened to think of it.
      #
      # Every probe is two-armed. M4 is expected OPEN - it is collision 11, and
      # U5 is scheduled to create exactly the file it describes - so the script
      # exits 0 with M4 listed rather than failing on a known-open item.
      - name: Plan measurements still reproduce
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          out=$(python3 docs/reviews/check-plan-measurements.py 2>&1); rc=$?
          echo "$out"
          # EXIT 2 IS AN UNMET PRECONDITION, NOT A VERDICT. The checker
          # exits 2 when `.venv` is absent, meaning NOTHING was measured;
          # it exits 1 when a plan claim has actually gone stale. Without
          # this branch the `-ne 0` below prints the stale-claim sentence
          # for both - reproducing, one layer up, the exact conflation the
          # checker was fixed to stop (#221). Measured: with `.venv` absent
          # the pre-fix body printed "a measurement ... no longer holds".
          # The shape is the one already used at the standards-citations
          # step, which tests `rc -eq 2` before its `-ne 0` branch.
          if [ "$rc" -eq 2 ]; then
            echo "::error::the plan probes had no venv, so nothing was measured - run uv sync --frozen"; exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::a measurement the plan rests a decision on no longer holds"; exit 1
          fi
          grep -qE 'Re-running [1-9][0-9]* plan measurements' <<< "$out" || {
            echo "::error::the harness ran no probes; its green means nothing"; exit 1; }

      # Likewise: the property is "0 escapes are holes", not a count of rows.
      # R3 flagged this script as referenced by NOTHING - not CI, not
      # pre-commit, not CONTRIBUTING.md - unlike the three other unwired
      # checkers, which each carry a stated reason for being unwired. It parses
      # CONFORMANCE-RESWEEP.md and asserts the row tally against the count the
      # document states about ITSELF, which is the property that matters: that
      # table has already produced a wrong population once, in a report that
      # then drove a work assignment.
      #
      # Wiring it rather than documenting why it is unwired, because it exits 0
      # today and takes no measurable time. A checker nothing invokes is
      # indistinguishable from one that always passes - the sixth instance of
      # that shape in this repository.
      - name: Resweep verdicts agree with the document's own count
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          out=$(python3 docs/reviews/check-resweep-verdicts.py 2>&1); rc=$?
          echo "$out"
          [ "$rc" -eq 0 ] || { echo "::error::the resweep parser exited $rc"; exit 1; }
          grep -q "tally and section 1's stated counts agree" <<< "$out" || {
            echo "::error::the parser exited 0 without reporting agreement; a"
            echo "::error::selector fault would look exactly like this"; exit 1; }

      - name: Coupling mutation sweep, no holes
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          out=$(python3 docs/reviews/check-coupling-sweep.py 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::the sweep exited $rc - it found holes in the gate"; exit 1
          fi
          grep -q '0 escapes are holes' <<< "$out" || {
            echo "::error::the sweep exited 0 without reporting '0 escapes are holes'"; exit 1; }
          grep -q 'ABORT' <<< "$out" && {
            echo "::error::the sweep aborted; it swept nothing"; exit 1; }
          exit 0

      # ---------------------------------------------------------------------
      # SUPPLY CHAIN - was its own job until #143. NONE of the actions below
      # have ever been executed; the pip-licenses step HAS been run locally.
      # ---------------------------------------------------------------------

      # LICENCE GATE - a DENY-list on the standard's flag-list, not an allow-list,
      # and the reason is measured rather than assumed. quality-gates.md:288-292
      # allow-lists five SPDX ids; pip-licenses reports FIFTEEN distinct spellings
      # over this tree for six actual licences ("MIT" and "MIT License" both
      # appear), so `--allow-only` on the standard's five ids is red on its first
      # run against a tree containing nothing objectionable.
      #
      # OPEN, and it needs a ruling rather than a default: four packages carry
      # licences on NEITHER the allow-list nor the flag-list, which
      # quality-gates.md:307 makes "Custom / unknown - always flag for review":
      #   cffi 2.1.1              MIT-0        RUNTIME
      #   email-validator 2.3.0   Unlicense    RUNTIME
      #   typing_extensions       PSF-2.0      RUNTIME
      #   pathspec 1.1.1          MPL-2.0      dev/build only, NOT shipped
      # All four are permissive or weak-copyleft-not-shipped, and no strong
      # copyleft is present in either tree. Extending the allow-list is an ADR,
      # not a CI edit. See docs/worklogs/U0-REPORT.md.
      # The ONE run: block with no strict-mode line, and that is deliberate:
      # it is a single command whose exit code IS the step's result, so there
      # is nothing after a failure to guard, no pipeline and no unset
      # variable. Recorded because an unexplained absence invites a 'fix',
      # and because the other 17 blocks do carry one - ADR-0023 SS scope.
      - name: Licence gate
        run: |
          uv run --frozen --with pip-licenses pip-licenses \
            --format=markdown \
            --fail-on="GPL;GPL v2;GPL v3;GNU General Public License;GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);AGPL;GNU Affero General Public License v3;LGPL;GNU Lesser General Public License;SSPL;BUSL;Business Source License"

      # EXECUTED GREEN in run 33582613697 (2026-09-02); before that, never.
      # Tool and pin are fixed by quality-gates.md:269-271:
      # anchore/sbom-action@v0, CycloneDX JSON *and* SPDX JSON, both uploaded.
      # Pointed at .venv so the SBOM comes from the FROZEN resolve - an SBOM
      # produced from an unfrozen resolve documents a build nobody shipped
      # (DESIGN.md §10's "The lockfile is the actual cure").
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .venv
          format: cyclonedx-json
          artifact-name: sbom.cdx.json

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .venv
          format: spdx-json
          artifact-name: sbom.spdx.json

      # EXECUTED GREEN in run 33582613697 (2026-09-02); before that, never.
      # Full history is the point; --only-verified keeps it from
      # drowning the gate in unverifiable candidates.
      # Pinned to a release tag, NOT @main. The standards corpus fixed this exact
      # defect in itself - devops/log.md:31, "fix(F-078): pin Trivy and TruffleHog
      # actions to release tags" - and ci-cd.md:552 carries the sanctioned pin. An
      # action on a branch tip is arbitrary third-party code re-fetched every run,
      # in the step whose whole job is finding secrets.
      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          extra_args: --only-verified

      # ---------------------------------------------------------------------
      # LINK CHECK - was its own job until #143. It needs no uv and no deep
      # history; it rides the checkout this job already has.
      # ---------------------------------------------------------------------
      # ---------------------------------------------------------------------------
      # EXECUTED GREEN as an action in run 33582613697 (2026-09-02); before that,
      # never - lychee is not installed on this machine. The
      # PROPERTY it asserts was verified locally against the tree with an equivalent
      # offline walk: every relative markdown link resolves on disk, and that walk
      # was positive-controlled against a deliberately broken link before its zero
      # was believed. The tree was also checked for the link forms that walk does
      # NOT parse - reference-style `[x]: target`, autolinks, raw <a href> - and
      # contains none, so inline `[x](y)` is the whole relative-link surface lychee
      # will see here.
      #
      # THE LINK AND FILE COUNTS THAT USED TO SIT IN THIS SENTENCE ARE GONE, not
      # refreshed. They read "27 relative markdown links across 63 files" and were
      # 56 across 244 when #167 re-walked the tree - a retyped figure beside a
      # container nothing compares it to, which is the shape #166 deleted in three
      # other places rather than putting back with a fresher number. The walk is
      # cheap and re-runnable; its output is the number.
      #
      # readme-standard.md:69 (B82) - "a link checker MUST run in CI; a broken link blocks
      # merge." COMPLIANCE-SPEC.md:84 makes it job 12 and picks no tool (:659-661
      # lists the choice as something that document deliberately left open).
      #
      # --offline IS THE WHOLE DESIGN DECISION, and it is a narrowing, so it is
      # stated rather than buried:
      #   - What it checks: every relative link resolves on disk. That is the class
      #     that rots here, because ADRs, reviews and research documents are renamed
      #     and moved while inbound links are not repointed.
      #   - What it does NOT check: external URLs. Checking them makes a REQUIRED
      #     check depend on third-party uptime, and a gate that goes red for reasons
      #     nobody caused is the failure shape ci.yml:286-295 already reasons about
      #     for pip-audit ("never a blanket ignore or a raised threshold: both
      #     convert a signal into silence") - it trains everyone to ignore the thing
      #     it exists to make authoritative.
      #
      # STATED CEILING, so this gate is not over-trusted. This project cites almost
      # entirely as BARE TEXT - `DESIGN.md:1544`, `quality-gates.md:76-81` - not as
      #     (those two are ILLUSTRATIONS OF THE FORM, not pointers to content.
      #     They are the only citations in this file that keep a line number,
      #     and they must: converting them to subject phrases would delete the
      #     very thing the sentence is showing. Do not repoint them either.)
      # markdown links, so only a small minority of this project's citations are in
      # scope at all. So this satisfies readme-standard.md:69 and it is NOT the
      # control for this project's
      # citation decay: the coupling gates in docs/reviews/ and the citation audits
      # are. Do not read a green here as "the citations are sound".

      - name: Relative links resolve
        uses: lycheeverse/lychee-action@v2
        with:
          # No --include-fragments. It would additionally require every `#anchor`
          # to resolve against the target's headings, which is a STRICTLY
          # STRONGER property than the one verified locally before this landed.
          # Shipping an assertion nobody has run is how a gate goes red on its
          # first run against a clean tree. Add it deliberately, with a run
          # behind it, not as a default.
          args: --offline --no-progress '**/*.md'
          fail: true

      # THE MIRROR IS STILL RUNNING. mirror.yml reports three states from inside
      # a run - configured-off, broken, and running-but-copying-nothing - and
      # names the fourth as a residual it cannot reach: that it is not running
      # at all. A workflow that does not run has no steps, so nothing written
      # inside one can speak for it. This step is the outside check its header
      # asks for.
      #
      # IT LIVES HERE, IN CI, AND NOT IN A CRON OF ITS OWN. A cron watching a
      # cron inherits the whole defect one level up - nobody reads it either,
      # which is #18 exactly. Coupling it to pushes is correct rather than a
      # compromise: the mirror exists to copy commits, so a stopped mirror
      # matters precisely when there are commits to copy, which is precisely
      # when this job runs. GitHub's 60-day-inactivity disable is the sharpest
      # case - during those 60 days nothing needs mirroring, and the first push
      # afterwards runs this step, which reads the workflow's `state` and says
      # so before that push goes uncopied.
      #
      # The full-suite controls for the five exit codes are the harness step in
      # the `test` job. This step is the LIVE call, and it is worth having as
      # its own thing: the fixture-fed controls all inject JSON, so not one of
      # them builds a URL, and the first live run 404'd on a path the API does
      # not accept. A control that never runs the artifact does not check it.
      #
      # THE FORK GUARD IS A BRANCH INSIDE THE STEP, NOT AN `if:` ON IT
      # (R18-M2). A fork carries mirror.yml because it forks the file, so
      # the API answers "active, zero runs" and this checker correctly says
      # NEVER RUN - exit 2 - on a repository that has no mirror to watch.
      # That is a red for something no commit contains.
      #
      # An `if:` would fix it and would go SILENTLY OFF the day this
      # repository is renamed or moved, which is the shape that let 119 red
      # mirror runs go unread: switched-off and broken rendering the same.
      # A branch inside the run block always executes and always PRINTS,
      # so a skip is visible in the log with the repository that caused it.
      #
      # This is the only repository-identity-dependent call in this file.
      - name: The mirror workflow is still running
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ "$THIS_REPO" != "evolvconsulting/fast-mcp-jobvite" ]; then
            echo "SKIPPED: $THIS_REPO is not the repository the mirror copies"
            echo "         FROM, so it has no mirror run history to watch. A"
            echo "         fork inherits mirror.yml but never its runs."
            echo "         Nothing is wrong; nothing was checked."
            exit 0
          fi
          uv run --frozen python scripts/check-mirror-liveness.py \
            --repo "$THIS_REPO" || exit 1

  # ---------------------------------------------------------------------------
  # The Python project.
  # ---------------------------------------------------------------------------
  test:
    name: Gate - lint, types, tests
    runs-on: ubuntu-latest
    # GATE TIER (#294): the only job on every push and every pull request, and
    # the one a branch-protection rule should require. It carries no `if:` on
    # purpose - a gate that can be switched off by an expression is a gate that
    # can go silently off, and this one must run or the run must be red.
    # UNCAPPED WOULD MEAN SIX HOURS. Since #238 moved the harness lane
    # into its own parallel jobs, this job is lint + types + the suite +
    # coverage + audits: 222s on the one green run of the old shape
    # (33582613697), and 161-min loaded runs were harness minutes that no
    # longer live here. 15 min is ~4x headroom over the measured 222s.
    timeout-minutes: 15
    steps:
      # FULL HISTORY, and this job genuinely needs it. `actions/checkout`
      # defaults to fetch-depth 1, so the clone holds ONE commit.
      # `probe-repoint-fail-closed.py` pins the historical commit
      # `28be78a` and asks `check-design-citations.py --since` to read
      # DESIGN.md at it; on a depth-1 clone `git show` exits 128 and the
      # whole job dies.
      #
      # THIS COST THREE CI ROUNDS TO FIND, because the failure surfaced
      # two layers up as `exit=1 failed=none` - a probe reporting that
      # something went wrong while discarding the traceback that said
      # what. `design-gates` and `supply-chain` already set this; `test`
      # was the job nobody had needed it in yet.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The lockfile is the cure, not the hand-written pins (DESIGN.md §10, the lockfile-not-hand-written-pins clause).
      # --frozen installs exactly uv.lock and fails rather than resolving.
      - name: Install from the frozen lock
        run: uv sync --frozen

      # A separate assertion from --frozen: this one says the lock still AGREES
      # with pyproject.toml, so a dependency edited without relocking is caught
      # here rather than at the next resolve. DESIGN.md §8 case #11.
      - name: No lock drift
        run: uv lock --check

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Types
        run: uv run --frozen mypy

      # ZERO SKIPS (DESIGN.md §8's zero-skips clause). A skip counts as a failure, so the
      # credentialed and network arms are excluded by SELECTION - the `-m` in
      # addopts - and never by skipif. The grep is the enforcement: pytest itself
      # exits 0 on a run full of skips, so the exit code alone cannot see this.
      - name: Default suite, zero skips  # B59 - no positional path, so testpaths stays authoritative
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          # ONE run, under --cov (#238/#241). The suite ran TWICE in this
          # job - plain here, instrumented again in a later Coverage step -
          # 241s of the job's 318s, with no stated reason anywhere. #241
          # verified all four ways this merge could have been wrong: the
          # --cov summary line is identical, the skip guard below FIRES on
          # a synthetic skip in the --cov output shape (positive-controlled),
          # test outcomes are identical (888/6 both ways), and the coverage
          # floors (fail_under=80 in pyproject per ADR-0010, --cov-fail-under
          # deliberately NOT passed so the floor lives in ONE place) now
          # gate through this same run. coverage.json feeds the per-module
          # floors step below.
          out=$(uv run --frozen pytest --cov --cov-report=term-missing --cov-report=json 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "$out"; exit "$rc"; }
          # THE HERE-STRING BELONGS TO THE GREP, NOT AFTER `then`. It was
          # `... skipped'; then <<< "$out"` from the SIGPIPE sweep (#85) until
          # actionlint's shellcheck integration reported SC2188. In that form
          # grep read STDIN instead of "$out", found nothing, and the guard
          # NEVER FIRED - so the step whose own comment says "a skip is a green
          # that tested nothing" was itself testing nothing. Measured both ways
          # against "1 passed, 3 skipped": broken form silent, this form fires.
          if grep -qE '[0-9]+ skipped' <<< "$out"; then
            echo "$out"
            echo "::error::the suite skipped tests. A skip is a green that tested nothing."
            exit 1
          fi
          # FLOOR, not merely non-empty. This guard read `grep -qE '[1-9][0-9]*
          # passed'` until L6, and that is satisfied by "1 passed" - three hundred
          # tests could vanish and the step stayed green. Nothing else in the
          # pipeline floors the count: coverage is a ratio, so deleting a test and
          # the code it covered can RAISE it.
          #
          # A ratchet. Raise it when tests are added; lowering it is a visible diff
          # that has to be defended. 413 measured at the merge of fix/m5-exception-detail.
          printf '%s\n' "$out" | bash scripts/check-suite-floor.sh 888

      # The negative arm of §8 #11 - a PRERELEASE pin whose transitive is not
      # named must fail to resolve under `prerelease = "explicit"` - performs a
      # real resolve, so it is deselected from the offline default suite and run
      # here with its positive control. It read "removing the fastmcp-slim pin"
      # until ADR-0036, which dropped that pin: at the GA 4.0.3 that mutation
      # RESOLVES, so the old arm would have gone green by testing nothing.
      # Floored for the same reason as the default suite, and it needs it MORE:
      # this arm is a matched pair, and the pair is the point. If the negative arm
      # alone stopped being collected, the positive one would pass by itself and
      # the step would be green while proving nothing. `pytest` exits 5 when it
      # collects nothing at all, so the empty case was already caught - the
      # HALF-empty case was not. 2 derived from `-m network --collect-only`, not
      # from the "2 deselected" in the default run, which also counts credentialed.
      - name: Network-dependent arms
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          out=$(uv run --frozen pytest -m network 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "$out"; exit "$rc"; }
          printf '%s\n' "$out" | bash scripts/check-suite-floor.sh 2

      # The credentialed suite is never run and never skipped, but it MUST be
      # collected: a suite that is excluded and never collected rots silently, and
      # an import error in it is invisible until the day someone has a credential
      # (DESIGN.md §8's one-declared-list rule).
      #
      # TIGHTENED BY U5, which is the first unit to add an arm here.
      #
      # This step used to accept exit 5 ("no tests collected") alongside 0,
      # because tests/credentialed/ was empty and U0 could not tell "the suite is
      # empty" from "the suite is healthy". Those two rendered identically, which
      # is the failure mode where a switched-off check and a broken one look the
      # same. U5 adds tests/credentialed/test_search_jobs_live.py, so the
      # distinction now exists and this step is what makes it visible: exit 0 AND
      # a non-zero collected count.
      #
      # FLOORED, not merely non-empty, for the same reason as the network arm: a
      # count is what catches the HALF-empty case, where one arm stops being
      # collected and the rest still pass. 3 derived from
      # `pytest -m credentialed --collect-only` on this branch, not from the
      # "deselected" figure in the default run, which also counts network.
      # QUICKSTART PARITY. `readme-standard.md:66` is priority: required -
      # "the Quickstart commands MUST be exercised by CI on every merge to
      # the default branch" - and nothing did. tests/test_readme.py checks
      # the README's structure, links, table and tool count; none of that
      # runs a command.
      #
      # The checker PARSES the commands out of README.md rather than
      # carrying a copy, so a README edit that breaks the Quickstart fails
      # here. A copy would be the second-list defect this repository has
      # now recorded in five separate places.
      #
      # It asserts the OUTPUT, not just the exit code: `fastmcp inspect`
      # prints an ERROR and exits 0 when pointed at a path with no server
      # object, which is how a wrong factory path looks identical to a
      # working one. Measured - I hit exactly that earlier.
      - name: The README's Quickstart still works
        run: uv run --frozen python docs/reviews/check-quickstart.py

      # WIRED BY R12-H1, AND THE REASON IS THE POINT. This harness had been
      # DEAD since 449968f: a `ruff format` pass reflowed the two-line
      # f-string its A1 anchor quoted, the anchor stopped matching, and the
      # `assert` behind it took rows A2, A3, A4 and the A5 NEGATIVE CONTROL
      # down with it. Measured against the blobs - the anchor occurs once at
      # d5340b7 and zero times at 449968f and dad014e. Nothing noticed for 45
      # commits BECAUSE NOTHING RAN IT.
      #
      # A probe that nothing runs cannot tell you it has stopped working, and
      # this one is the only amputation evidence for four behaviour fixes -
      # the fail-closed REPOINT-EXEMPT read, the checker's stderr health
      # check, and two narrowed `except` clauses. So it is a step now.
      #
      # `uv run --frozen python`, NOT `python3`: row A4 mutates
      # probe-r6-breaker-reset.py, which imports httpx2. Under a bare
      # interpreter that row reports "could not import" and the harness
      # correctly refuses a partial run.
      # ---------------------------------------------------------------
      # THE HARNESS LANE IS NO LONGER IN THIS JOB (#238). The mutation
      # and amputation harnesses - once 41 gated steps here, 4969s of
      # this job's 5191s - run in the parallel harness-* jobs at the
      # bottom of this file, on EVERY trigger. The schedule-only cadence
      # this block used to describe was rejected: moving 86 minutes to a
      # Sunday cron hides the cost, it does not remove it. What remains
      # in this job below are the cheap harness-adjacent controls that
      # cost seconds.
      # ---------------------------------------------------------------
      - name: Docs-lint amputations, every row caught
        run: uv run --frozen python docs/reviews/probe-docs-lint-amputation.py

      - name: Collect the credentialed suite
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          out=$(uv run --frozen pytest -m credentialed --collect-only -q 2>&1); rc=$?
          echo "$out"
          [ "$rc" -eq 0 ] || {
            echo "::error::the credentialed suite did not collect cleanly (exit $rc)"
            exit 1; }
          # NO `^` ANCHOR. pytest prints the count inside a banner padded with
          # `=` on both sides - "=== 3/400 tests collected (397 deselected) ===" -
          # so an anchored pattern matches nothing. Measured against the real
          # output on this branch rather than written from memory; the anchored
          # version was here first and would have failed this step every run.
          n=$(printf '%s\n' "$out" | grep -oE '[0-9]+/[0-9]+ tests collected' \
                | grep -oE '^[0-9]+' | tail -1)
          [ -n "$n" ] && [ "$n" -ge 4 ] || {
            echo "::error::expected at least 3 credentialed tests collected, got '${n:-none}'"
            exit 1; }

      # ---------------------------------------------------------------------
      # THE HARNESS BLOCK. Every step below calls scripts/ci-harness-gate.sh
      # rather than carrying its own `run:` logic, and the reasoning for that -
      # including why the vocabulary each step greps for is DERIVED from the
      # harness's own source instead of listed here - is in that file's header.
      # It is one artefact, so it can be run locally, reviewed as code, and
      # exercised by a control; a hand-copied twin of a gate is a second list
      # that drifts while still passing.
      #
      # The exit-code contract these steps rely on also lives there:
      #   0 = the harness ran and every declared assertion behaved
      #   1 = a FINDING - an unexpected survivor, or a row that measured nothing
      #   3 = could not run: the baseline is red, or a declared test id is gone
      #   5 = REFUSED - a row's pytest run was not a measurement: a collection
      #       error, internal error, usage error or timeout produces no PASSED
      #       lines, which every amputation harness here reads as a perfect
      #       kill. scripts/lib/verdict-guard.sh refuses instead (#254).
      # Those FOUR are kept apart on purpose. A message that misdescribes what
      # happened sends the next reader to the wrong place.
      #
      # An amputation harness exits 0 BY DESIGN, because survivors are its
      # OUTPUT and not its verdict, so no step here gates on the exit code
      # alone. `--min-rows` is what notices a row that stopped running at all.
      # ---------------------------------------------------------------------

      # THE STATIC CHECK COMES FIRST, because it is the cheap one. It reads every
      # anchor out of every harness and greps the target file, in milliseconds,
      # without running anything. B49b reflowed 1608 lines and broke U3's M8;
      # this is what would have caught it on the sweep commit rather than leaving
      # main red until a harness run tripped over it. It found one genuinely
      # stale anchor the day it was written.
      #
      # THE FLOOR IS HERE FOR THE SAME REASON THE SUITE FLOOR IS. If a parser
      # shape stops matching, every anchor that still parses resolves perfectly
      # and the checker reports OK on a fraction of its coverage. Measured by
      # row F1 of check-harness-anchors-controls.sh, which deletes shape C:
      # 464 drops to 449 with an exit code of 0. Lowering this number is a
      # visible diff that has to be defended.
      #
      # 458 UNTIL #167, AND THAT NUMBER WAS DERIVED FROM A BLIND SELECTOR.
      # Three live anchors in check-u1-boot-amputation.sh were invisible to
      # the parser, so the floor certified a count that had never included
      # them. The floor was raised only AFTER the selector was widened and
      # the widening was proved by three control pairs; a floor set from an
      # instrument nobody has measured is #91's slack with the slack
      # invisible.
      - name: Harness anchors still resolve
        run: python3 scripts/check-harness-anchors.py --self-check --floor 464

      # WIRED ONLY NOW THAT ITS BACKLOG IS ZERO. It reported 10 floorless
      # harnesses when written and stayed unwired through all of them,
      # because a gate that lands red is a gate people learn to ignore -
      # which this repository had already proved with a secret-scan step
      # that was red for days and unread.
      #
      # It answers a NARROWER question than it looks: does every harness
      # have a row floor at EITHER layer, an internal `ROW_FLOOR` or a
      # `--min-rows` here. It cannot tell whether a floor is RIGHT; only a
      # run of that harness establishes that, and no static reader can
      # distinguish a derived number from a typed one.
      # WIRED because it was GREEN and unwired, which is a green nobody asked
      # for - found by enumerating `docs/reviews/check-*.py` against this file:
      # 18 checkers, 16 wired, and of the two that were not, this one had no
      # backlog at all. The other (`check-env-vars-are-declared.py`) has one
      # finding and stays out until #60 closes it.
      #
      # NOT redundant with `check-design-citation-shape.py`, which asks a
      # NARROWER question over a NARROWER container: whether a target could be
      # anyone's subject, across `src/ tests/ scripts/`. This one asks whether
      # every citation in the WHOLE TREE resolves at all, and reports which ones
      # MOVED after an edit - which is the instrument #95's re-freeze needs.
      # Neither is sufficient: both are bounds checks, and a contracted range
      # still resolves. Three wrong citations here were found by hand, none by
      # a gate.
      - name: Every DESIGN.md citation resolves to a line that exists
        run: python3 docs/reviews/check-design-citations.py

      - name: Every harness is wired and has a row floor
        run: python3 docs/reviews/check-row-floors.py

      # The floor EXISTING and the floor being RIGHT are different claims,
      # and #91 found the gap between them: u7 held 31 rows against a floor
      # of 26, so five rows could be deleted with this job green. Neither
      # branch was wrong - the MERGE produced the slack, which is the
      # direction that never announces itself.
      #
      # THREE CLAIMS NOW, and the program prints a population count for each
      # rather than naming one here, because the counts that were named here
      # went stale. It checks the harnesses the control table names AND asserts
      # that table is EQUAL to the set of harnesses carrying a ROW_FLOOR
      # (R12-M1, which found one missing), AND compares every `--min-rows` in
      # this file to the rows its harness will actually print (R12-H2, which
      # found u14 at 16 rows against 10 and u7's amputation at 22 against 19).
      # The remainder is #107: one canonical machine line per harness.
      - name: Every checked row floor EQUALS its harness's live row count
        run: python3 docs/reviews/check-row-floor-exactness.py

      # THE ARMS OF THE STEP ABOVE, run by nobody until this landed. The
      # live count is printed by the step itself - a number retyped here
      # decays, which is the rule that checker's own docstring states.
      # #187 rebuilt that checker's container as a KIND rather than a glob,
      # and the fold at 65fabe4 added two more members; the live census is
      # printed by the step above under `CONTAINER:`. A container change to a
      # gate with its own control table is exactly the thing whose arms need
      # running. It plants and removes one file under `src/` in a `finally`
      # that its own arm A7 asserts, which is why it can share a job with its
      # subject.
      - name: The floor container's own arms
        run: python3 docs/reviews/check-row-floor-exactness.py --self-test

      # #289: three harnesses build their kill verdict from a TEST NAME, and
      # until this landed they pasted that name into an extended regular
      # expression, where a parametrised id like `test_x[1]` is a PATTERN and
      # matches the character `1`. #264 measured the hazard as real and as
      # unreachable today (0 of 681 names carry a metacharacter), so what this
      # guards is the FIRST parametrised killer somebody names in a row - the
      # trigger, not a live bug. It reads each harness's verdict expression
      # out of the shipped file and refuses if it cannot find one, so it goes
      # red on a shape change rather than passing about a harness it no longer
      # describes. Static, no pytest, under a second; it shares this job for
      # the same reason the two steps above do.
      - name: A test name reaches a verdict as a literal, never as a pattern
        run: bash docs/reviews/probe-289-ere-interpolation.sh

      # WIRED GREEN, backlog zero. #85 fixed sixteen of these in one day and
      # my first pass found only five - the sweep stopped at the directory I
      # was editing, leaving eleven in this file, one of which (`grep -qE
      # '[0-9]+ skipped'`) failed OPEN on exactly the longest output.
      # The step NAME deliberately does not quote the pattern: this checker
      # scans this file, and its first version matched its own step name.
      # Third instance today of a defect-grep finding prose about the defect,
      # and the fix is to keep the pattern out of the prose - NOT to narrow
      # the pattern, which stops matching a real instance before it stops
      # matching a comment.
      - name: No SIGPIPE-prone pipeline judges a gate
        run: python3 docs/reviews/check-no-sigpipe-pipelines.py

      # WIRED WITH THE FLAGS IT READS, not after them. #152 wrote this
      # checker AND the three --anchors-applied/--result-killed flags
      # above in the same change, and could not wire either half because
      # ci.yml was contended. A field with no reader is inoperative code;
      # so the fields and the flags land together, in this commit.
      - name: A harness that diagnoses a landing failure publishes it
        run: python3 docs/reviews/check-landing-published.py

      # The restorer above reads a RUN STATE FILE rather than `git status`,
      # because `git status` can say the tree is dirty and can never say whether
      # that dirt has an owner. Its own header named the gap: only
      # probe-harness-exit-codes.sh wrote that state, so a harness run through
      # scripts/ci-harness-gate.sh - which is every harness step in this file -
      # was invisible to it. The gate writes it now, and these four arms are
      # what say so. Not routed through ci-harness-gate.sh for the same reason
      # as the step above: that takes a bare harness NAME under scripts/.
      #
      # Every arm builds its own scratch repository, which is not tidiness: the
      # gate only records state on a CLEAN tree, and no arm could exercise that
      # path against a tree someone is working in.
      - name: The gate records who is mutating
        run: bash docs/reviews/probe-131-gate-state.sh

      # THE MIRROR PUSH STEP HAD NEVER EXECUTED up to 2026-09-04 - there was no
      # credential, so its `if:` skipped it on every run this repository had ever
      # had, and this probe was written against a step nothing had run. That
      # changed with `MIRROR_SSH_KEY`; the probe is unchanged and still correct,
      # because it EXTRACTS the guard rather than retyping it. What is new is
      # that its subject now runs, so a break in it will be observed rather than
      # merely asserted. The original wording follows, as the reason it exists:
      # there was no MIRROR_TOKEN, so
      # its `if:` has skipped it on every run this repository has ever had. Its
      # own comment said "mirroring nothing and mirroring everything must not
      # both read as success", and the remedy it shipped only PRINTED the refs
      # on the success path. This probe EXTRACTS the guard out of mirror.yml
      # rather than retyping it, so it cannot pass against a stale copy, and
      # its third arm amputates the `exit 1` to prove the first two are not
      # vacuous. It touches no remote: a mirror push is `--force --prune` and
      # is not a thing to test by running.
      - name: The mirror refuses a zero-ref push
        run: bash docs/reviews/probe-mirror-zero-refs.sh .github/workflows/mirror.yml

      # A REPORT THAT WAS WRITTEN IS NOT A REPORT THAT WAS COMMITTED.
      # PREAMBLE.md:177 has said so since the first 48KB report was lost
      # in a worktree; REVIEW-R18.md then sat untracked in another one,
      # and I declared it destroyed before a second pair of eyes found it
      # on disk. A rule nothing checks is a rule that documents its own
      # violations. Bare on purpose: the --briefs/--record/--tracked
      # flags exist for the controls, and passing them here would ask a
      # different question from the one this gate is for.
      - name: Every report a brief cites is committed
        # NO `|| exit 1` HERE, DELIBERATELY. That idiom exists for a
        # command that is not the LAST in an AND-list, where errexit
        # would not fire. This is a single command, so GitHub's
        # `bash -e {0}` already fails the step on any nonzero - and
        # `|| exit 1` would MAP EXIT 2 ONTO 1, collapsing the checker's
        # deliberate refusal ("could not read git ls-files, so NOTHING
        # was checked") into an ordinary finding. Arm A5 of its controls
        # exists to prove that refusal is 2 and not 1; wiring that
        # erases the distinction makes the arm untrue in production.
        run: uv run --frozen python docs/reviews/check-brief-report-references.py

      - name: Controls for the brief-report reference gate
        run: bash docs/reviews/check-brief-report-refs-controls.sh

      # THE DISCRIMINATOR'S OWN ARMS (#204). The bare run is an
      # ENUMERATOR - it counts a corpus and judges nothing, so there is
      # no pass to gate on. Its `--controls` is the gate: 16 arms in
      # BOTH directions off ONE shared exclusion function, so no arm
      # tests a copy of its subject. Measured green before wiring.
      - name: The bare-citation discriminator's controls
        run: uv run --frozen python docs/reviews/probe-204-bare-citations.py --controls

      # ADR NUMBERS ARE UNIQUE, CONTIGUOUS, AND MATCH THEIR OWN HEADINGS.
      # Two agents claimed 0027 within one hour: one checked `git log --all`
      # before choosing and was correct when it looked; the other created its
      # ADR afterwards on a different branch. BOTH MERGED CLEANLY, because the
      # filenames differ and git has no opinion about the digits in them. An
      # ADR number is cited from code, so two documents cannot share one.
      #
      # THE SAME STEP NOW CHECKS THE INDEX TABLE, EQUAL IN BOTH DIRECTIONS.
      # `docs/adr/README.md`'s table had silently stopped at 0023 with twelve
      # ADRs missing, including the two the as-at-acceptance ruling cites BY
      # NUMBER twenty lines above the table. Nothing regenerated it and no gate
      # looked. A file with no row and a row with no file are different
      # failures and both are refused. It is folded into this already-wired
      # step rather than being a new checker, so `check-checkers-are-wired.py`
      # has nothing new to police.
      - name: ADR numbers are unique and contiguous, and the index matches
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          out=$(python3 docs/reviews/check-adr-numbers.py 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::two ADRs share a number, a number is missing, or a heading disagrees"
            exit 1
          fi

      # ----- U15, the two commit-time gates (DESIGN.md §10.1's two commit-time gates, C8-I1) -----
      # The pre-commit hooks are the primary control and they run on a
      # developer machine, which means they can be skipped with --no-verify or
      # simply not installed. These steps are the backstop that notices.

      # WIRED GREEN, AND WATCHED GOING RED FIRST. The nine unbounded pytest
      # calls this guard exists to catch were fixed in the same commit, so it
      # lands at 73/73 rather than landing red - a gate that arrives failing
      # is a gate people learn to scroll past, and this repo has scars from
      # exactly that. Before wiring, it was watched failing on a planted
      # unbounded call in BOTH spellings, and passing on the same call once
      # bounded; `--self-test` carries that positive control permanently.
      #
      # It is cheap - one grep over `git ls-files '*.sh'`, no suite run - so
      # it sits here with the other static gates rather than among the
      # harnesses, and it fails in seconds instead of after a hung 2.5-hour
      # job, which is the failure it exists to prevent.
      - name: Every pytest invocation is bounded by a timeout
        run: |
          set -uo pipefail
          bash scripts/check-pytest-bounded.sh --self-test || {
            echo "::error::the bounded-pytest guard cannot detect its own"
            echo "         planted unbounded call; its green means nothing"; exit 1; }
          bash scripts/check-pytest-bounded.sh || {
            echo "::error::a pytest invocation runs unbounded; see #108"; exit 1; }

      - name: Committed file types, whole tree
        # --all, not the staged set: in CI there is no index to diff, and the
        # question here is different from the hook's. The hook asks "is this
        # commit clean"; this asks "is the REPOSITORY clean", which is the only
        # question that catches a file that got in with --no-verify.
        run: |
          set -uo pipefail
          scripts/check-committed-file-types.py --all || {
            echo "::error::a tracked file fails the committed-file-type gate"; exit 1; }

      - name: Commit-time hooks run clean - secret scan, shellcheck, file types
        # THIS STEP RUNS ALL THREE COMMIT-TIME HOOKS, and the name now says so.
        # `.pre-commit-config.yaml` defines exactly three: committed-file-types,
        # secrets-baseline and shellcheck. `run --all-files` runs every one, so
        # a failure here is as likely to be ShellCheck as the secret scan.
        #
        # IT WAS CALLED "Secret scan hook runs clean" AND THAT COST A DIAGNOSIS.
        # Run 33610211810 failed on this step; the secret scan PASSED and the
        # real failure was a malformed shellcheck directive in a harness. The
        # name sent the first hypothesis at detect-secrets and the baseline -
        # the failure shape this repo has measured three times in an hour - and
        # the whole cycle was spent on the wrong subsystem. A failing step's
        # name is the highest-leverage text in a run, and this one described a
        # third of what the step does.
        #
        # The name was DEFENSIBLE WHEN WRITTEN and went stale under it. db5c21e
        # named it on 2026-08-28 when there were two hooks, one of which is
        # inert here (see below); 567dcc4 added shellcheck eleven hours later
        # and nothing re-read the name. Adding a hook must mean re-reading the
        # name of every step that runs the whole set.
        #
        # "secret scan" is KEPT as a substring on purpose: twelve docs cite the
        # old step name, and by ec57a65 dated records are not repointed. This
        # way their citations still resolve by grep while the name stops lying.
        #
        # THE FILE-TYPE GATE IS PRESENT BUT INERT HERE. Measured, because the
        # obvious reading is wrong and a wrong reading is a green that tested
        # nothing:
        #
        #   $ pre-commit run committed-file-types --all-files --verbose
        #   committed-file-type gate: 0 file(s) checked, none refused.
        #
        # `--all-files` is a pre-commit concept: it passes every file as hook
        # ARGUMENTS. The file-type gate takes no filename arguments by design -
        # it reads the INDEX, because that is the only way to require an
        # allowlist exception to be staged in the same commit. In CI nothing is
        # staged, so the gate correctly reports zero files and exits 0.
        #
        # The "Committed file types, whole tree" step above is what actually
        # covers it. Do not delete that step on the grounds that this one runs
        # the same hook: it does not.
        #
        # What this step genuinely covers is the secret scan over every file,
        # and .secrets.baseline staying in step with the tree - a new finding
        # nobody audited turns this red.
        #
        # THIS STEP WAS THE ONE FAILING STEP IN THE ONLY RED JOB, and the
        # reason it could never recover is worth keeping. `Yelp/detect-secrets`
        # shipped the hook that ran here, and that hook REWRITES
        # `.secrets.baseline` in place to refresh each finding's `line_number`;
        # pre-commit fails whenever a hook modifies a file. Its own message
        # says `git add .secrets.baseline`, which a developer can do and CI
        # cannot, so every regeneration bought only the days until the next
        # edit moved a line. Measured at ccbdaae: 1344 -> 1617 on an
        # `is_secret: false` entry in this file that was never a secret.
        #
        # scripts/check-secrets-baseline.py replaced it in
        # `.pre-commit-config.yaml`. It gates on the SET of
        # (filename, type, hashed_secret): a new finding is red, a line number
        # moving is not. DO NOT "fix" a future red here by adding
        # `git add .secrets.baseline`, `|| true`, or by dropping the hook -
        # the first is the gate rewriting its own baseline, and this
        # repository has measured that failure three times in one hour.
        #
        # `--controls` runs FIRST and on its own line, because the comparison
        # is the half that decides red or green and a comparison that has
        # stopped comparing looks exactly like a clean tree. It needs no
        # network and no scanner. `|| exit 1` is not decoration: this body has
        # no `-e`, so a bare failing command here would be ignored and the
        # step would pass.
        run: |
          set -uo pipefail
          python3 scripts/check-secrets-baseline.py --controls || exit 1
          uv tool run pre-commit@4.6.2 run --all-files --show-diff-on-failure || {
            echo "::error::a commit-time gate failed on the tree"; exit 1; }

      # LANDED BY U11. pip-audit has no severity threshold: one advisory anywhere
      # in the transitive tree turns a required check red, and we pinned a beta
      # stack deliberately, so we expect this and owe it a sanctioned response
      # (DESIGN.md §10's advisory policy). scripts/check_advisories.py is that response - it
      # reads the [tool.fast-mcp-jobvite.advisory-ignores] table (landed empty in
      # pyproject.toml), emits pip-audit's --ignore-vuln flags from it, and exits
      # non-zero on any expired entry.
      # DO NOT replace this with a bare `pip-audit || true`, and never a blanket
      # ignore or a raised threshold: both convert a signal into silence for every
      # future advisory, not just this one.
      #
      # WHAT THIS STEP DOES AND DOES NOT COVER, stated because the obvious
      # reading is wrong and a gate trusted for the wrong thing is worse than
      # none. This step runs THE EXPIRY HALF ONLY. It enforces that every
      # recorded ignore is well-formed and unexpired, and it prints the
      # --ignore-vuln flags on stdout.
      #
      # THE FLAGS ARE NOW CONSUMED. U11 wrote this block saying plainly that
      # nothing ran pip-audit, so the ignore mechanism was fully built and
      # connected to nothing while the dependency tree went unaudited. It could
      # not fix that itself: pip-audit was not in the frozen lock and the
      # dependency slot was held elsewhere. Both are resolved, so the second step
      # below is the half U11 could only describe.
      #
      # pip-audit is a DECLARED dev dependency and is run `--frozen`. Never
      # `uv run --with pip-audit`: that resolves the tool unpinned outside
      # uv.lock, which is the defect ADR-0015 records for pip-licenses - a gate
      # auditing the frozen resolve that is itself unfrozen.
      #
      # AND U11'S BIGGEST UNVERIFIED ITEM IS NOW VERIFIED. It could not confirm
      # that pip-audit actually accepts `--ignore-vuln` repeated per advisory,
      # because the tool was not installed; the string came from the design and
      # the plan, and neither is the tool. `pip-audit --help` reads:
      #   --ignore-vuln ID   ignore a specific vulnerability by its vulnerability
      #                      ID; this option can be used multiple times
      # So the flags the script emits are the flags the tool takes.
      - name: Advisory audit - the expiry half
        run: uv run --frozen python scripts/check_advisories.py

      # The audit half. The flags come from the table via the script, so the
      # table is the single source for both, and a hand-maintained flag list
      # cannot drift from it - the two-lists defect DESIGN.md §10 names, where the table is the single source.
      #
      # The script's STDOUT IS the flag list and nothing else, which is why this
      # captures it directly. I first wrote `--flags-only` here, an option that
      # does not exist - CI referencing an interface nobody checked, in the step
      # whose whole point is that the design asserted an interface nobody checked.
      # Read `check_advisories.py --help` before changing this.
      - name: Dependency audit
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          flags=$(uv run --frozen python scripts/check_advisories.py); rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::the advisory table is invalid or an entry expired"; exit 1
          fi
          echo "ignore flags from the table: ${flags:-<none>}"
          # Unquoted ON PURPOSE: $flags is a flag list built by our own script from
          # a table of advisory ids, and word-splitting is how it becomes argv.
          # shellcheck disable=SC2086
          uv run --frozen pip-audit $flags || {
            echo "::error::pip-audit found an advisory with no sanctioned ignore."
            echo "::error::Fix or remove the dependency. If genuinely unreachable,"
            echo "::error::add a time-boxed single-advisory entry to"
            echo "::error::[tool.fast-mcp-jobvite.advisory-ignores] per DESIGN.md §10's advisory policy."
            echo "::error::NEVER a blanket ignore and NEVER a raised threshold."
            exit 1; }

      # ----- U1, enabled here (IMPLEMENTATION-PLAN.md:1272) -----

      # `fastmcp inspect` takes a server spec and server.py is U1's file. The
      # report is emitted and uploaded so the NEXT build can diff against it,
      # which is what DESIGN.md §10's diffed-between-builds clause asks for.
      #
      # UNVERIFIED, and U1 does not remove the marker: standing this up does
      # NOT execute it. A diff that has never seen a real capability change
      # has only ever compared a build to itself. The `ResponseLimiting`
      # regression is the case it is modelled on and nobody has replayed that
      # bump against this check.
      #
      # The spec is the FACTORY, not the module: server.py builds its FastMCP
      # instance from validated settings, so there is no importable
      # module-level `mcp` object to point at. The env below is the minimum
      # loopback-stdio configuration that passes config.py's refusals.
      - name: Capability drift report
        env:
          JOBVITE_API_KEY: inspect-only-not-a-credential
          JOBVITE_API_SECRET: inspect-only-not-a-credential
          JOBVITE_TOOLS: search_jobs
        run: |
          set -uo pipefail
          uv run --frozen fastmcp inspect \
            "src/fast_mcp_jobvite/server.py:create_server" \
            -f mcp -o inspect.json || {
              echo "::error::fastmcp inspect failed"; exit 1; }
          test -s inspect.json || {
            echo "::error::inspect.json is empty"; exit 1; }

      - name: Upload the capability report
        uses: actions/upload-artifact@v4
        with:
          name: fastmcp-inspect
          path: inspect.json

      # ADR-0010's PER-MODULE floors, which `fail_under` cannot express and which
      # `pyproject.toml` used to say were "enforced by the units that create those
      # modules" - an obligation enforced by nobody. Two critical paths were under
      # their floor on BRANCH (78.6% and 80.8% against 90) while the aggregate gate
      # sat green at 95%.
      #
      # It parses the floors AND the critical-path roles out of `DESIGN.md`, and
      # joins them to modules by a `COVERAGE_ROLE` each module declares - the map is
      # not inside the checker, and the two sets are asserted EQUAL both ways.
      - name: ADR-0010's per-module coverage floors
        run: python3 docs/reviews/check-coverage-floors.py

  # ---------------------------------------------------------------------------
  # EXECUTED GREEN in run 33582613697 (2026-09-02, analyze 51s); before that,
  # never. github/codeql-action/*@v3 per the standards' pinned set.
  # ---------------------------------------------------------------------------
  codeql:
    name: Merge - CodeQL
    runs-on: ubuntu-latest
    # MERGE TIER (#294). Not on a pull request: every step below either scans
    # the tree for something a commit-time hook already refuses on the push
    # path (secrets, file types, shellcheck), or reads the supply chain, which
    # changes when a lock file lands rather than when a branch is edited.
    # Keeping it off the PR path takes it out of the per-push bill without
    # taking it off `main`, which is the ref a release is cut from.
    #
    # `github.event_name` only - never `secrets`, which GitHub does not
    # provide in this position and which failed to evaluate silently for 119
    # consecutive mirror runs (R3-H1). A job-level `if` that cannot be
    # evaluated does not fail; it produces a run with zero jobs.
    if: github.event_name != 'pull_request'
    # UNCAPPED WOULD MEAN SIX HOURS - observed max 80s; CodeQL scales with the tree, so more headroom.
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:python


  # ---------------------------------------------------------------------------
  # Which paths this push touched, classified BY ROLE (#294, plan 2.6).
  # ---------------------------------------------------------------------------
  #
  # THE SELECTOR IS BY ROLE, NEVER BY DIRECTORY, and `docs/` is exactly why.
  # `docs/reviews/*.py` and `docs/reviews/*.sh` are CHECKERS AND PROBES - live
  # gates that happen to live under a documentation directory - while
  # `docs/reviews/*.md` beside them are records. A filter reading `docs/**` as
  # documentation would stop gating twenty-odd checkers and look identical to
  # one that is working.
  #
  # IT FAILS CLOSED. A diff that cannot be computed - a force-push, a first
  # push whose `before` is all zeros, a missing object - yields `true` and
  # fires the assurance tier. The expensive direction is the safe one.
  #
  # THIS JOB IS NOT A GATE and runs no checker; it exists so that the assurance
  # tier can be triggered by a change to the code it tests without that
  # decision living in a `paths:` filter, which is workflow-wide and could not
  # tell the two roles above apart.
  changes:
    name: Merge - which paths changed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.role.outputs.code }}
    steps:
      # fetch-depth 0: this job diffs against `github.event.before`, which a
      # depth-1 clone does not contain.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # No command substitution anywhere below. Under GitHub's `bash -e` a
      # `out=$(cmd)` assignment stops the block at the first failure and never
      # reaches an `rc` check - measured three times on this repository - so
      # every branch here is an `if` over a command, and the diff goes to a
      # file rather than a variable.
      - name: Classify the pushed paths by role
        id: role
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          CHANGED="$RUNNER_TEMP/changed-$GITHUB_RUN_ID.txt"
          CODE_RE='^(src/|tests/|scripts/|[.]github/workflows/|pyproject[.]toml$|uv[.]lock$|server[.]json$|docs/reviews/[^/]+[.](py|sh)$)'
          if ! git diff --name-only "$BEFORE" "$AFTER" > "$CHANGED"; then
            echo "COULD NOT DIFF $BEFORE..$AFTER. Firing the assurance tier:"
            echo "an unreadable diff must not read as 'nothing to check'."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PATHS IN THIS PUSH:"
          cat "$CHANGED"
          if grep -qE "$CODE_RE" "$CHANGED"; then
            echo "VERDICT: code=true - at least one path above is code, a"
            echo "harness, a checker or the workflow itself. Assurance fires."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "VERDICT: code=false - every path above is a record. The"
            echo "assurance tier is skipped; the weekly cron still covers it."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # ASSURANCE TIER - every harness and every probe, ONE JOB, SERIAL (#294).
  # ---------------------------------------------------------------------------
  #
  # WHAT THIS REPLACES, AND WHY THE OLD SHAPE WAS THE WRONG TRADE. Until this
  # change these steps were twelve parallel `harness-*` jobs on EVERY trigger.
  # That is optimal for wall clock and pessimal for the bill, because the two
  # are different functions of the same run: wall clock is the MAX across
  # lanes, and billing is the SUM, with GitHub rounding EVERY JOB UP to a whole
  # minute. Measured on the pre-re-tier baseline (`baseline/pre-retier`, run
  # 33680282835, recorded in docs/reviews/MEASURED-baseline-pre-retier.md):
  # a 343s wall over 3222s of work, 61 billed minutes of which 6.4 were pure
  # per-job rounding, and 13 lane setups each paying its own checkout, uv and
  # python install.
  #
  # This repository is PUBLIC, so that bill is zero today. The template built
  # from it seeds PRIVATE repositories, where it is not - which is why the
  # shape optimises billed minutes and lets wall clock follow.
  #
  # NOBODY WAITS ON A WEEKLY RUN. Fan-out here buys latency no human
  # experiences and pays twelve roundings and twelve setups for it. Serial is
  # therefore not a compromise; it is the correct shape once the trigger moves.
  #
  # WHAT SERIALISING COSTS, STATED RATHER THAN HIDDEN:
  #   - A failure stops the lane. Twelve jobs used to fail independently, so
  #     one red still reported eleven greens. Here the first red is the last
  #     thing you learn. On a weekly tier that is an acceptable trade; on the
  #     push path it would not be, which is the other half of why it moved.
  #   - Every step now runs in ONE checkout. A harness that strands a mutation
  #     poisons its successors instead of only itself, so the last step of this
  #     job asserts `src` and `tests` are byte-identical to the checkout.
  #
  # THE #267 RULING IS DISCHARGED HERE. It required the compound lane names to
  # be regenerated in the SAME commit as any repack; collapsing twelve lanes
  # into one IS that repack, and those names are gone rather than stale.
  # `docs/reviews/probe-273-packing.py` selects jobs whose name begins
  # `harness`, so this job keeps that prefix and the probe still finds every
  # step it used to - by step name, which is unchanged for all of them.
  harness-assurance:
    name: Harness assurance - every harness and probe, serial
    needs: [changes]
    # TWO THINGS IN THIS EXPRESSION ARE LOAD-BEARING, AND BOTH ARE FAILURE
    # MODES RATHER THAN FEATURES.
    #
    # `always()`, because `changes` is SKIPPED on `schedule` and on
    # `workflow_dispatch`, and a skipped need skips its dependants with it.
    # Without `always()` the manual trigger - the one a human reaches for, and
    # the one that proves this tier is not merely decorative - would be the one
    # that silently does nothing.
    #
    # `!= 'false'` rather than `== 'true'`, because those are not complements
    # here. If `changes` FAILS or is cancelled its output is the empty string,
    # and `== 'true'` would read that as "no code changed" and skip the whole
    # assurance tier on a broken classifier - fail-open, in the one place where
    # a skip and a green are indistinguishable. `!= 'false'` runs the tier
    # unless the classifier positively said not to. The `push` guard keeps that
    # from also firing on a pull request, where `changes` never ran at all.
    if: >-
      always() && (
        github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && needs.changes.outputs.code != 'false')
      )
    runs-on: ubuntu-latest
    # UNCAPPED WOULD MEAN SIX HOURS. The twelve lanes summed to 3222s of work
    # on the baseline run and this job runs that work end to end in one place,
    # so the cap is set well above it rather than near it: a harness that hangs
    # must fail, and a harness that is merely slow must not.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install from the frozen lock
        run: uv sync --frozen

      - name: U3 audit amputation harness ran every row
        run: bash scripts/ci-harness-gate.sh check-u3-audit-amputation.sh --amputation --anchors-applied --min-rows 10 --row-re '^########## A[0-9]+ '

      # `A[0-9]+[a-z]*` and NOT `A[0-9]+ `: M-5's rows are A9b..A9f, and the old
      # pattern required a space straight after the digits, so it would have
      # counted 12 while 17 ran - a gate reporting the number of rows it can SEE,
      # which is how a row goes missing without a red run.
      - name: U4 client amputation harness ran every row
        run: bash scripts/ci-harness-gate.sh check-u4-client-amputation.sh --amputation --anchors-applied --min-rows 17 --row-re '^########## A[0-9]+[a-z]* '

      - name: U12 job feed amputation, every row applied
        run: |
          bash scripts/ci-harness-gate.sh check-u12-jobfeed-amputation.sh \
            --amputation --anchors-applied --min-rows 10 --row-re '^########## A[0-9]+ '

      # ----- the critical-path coverage rows -----
      # **NO `--amputation` FLAG, deliberately, unlike every sibling step.** That
      # flag makes exit 1 a FINDING rather than a failure. This harness already
      # makes that allowance itself for its one DECLARED survivor (A1, a defensive
      # guard that is reachable but not load-bearing), so its exit 1 means an
      # UNDECLARED vacuous row - which must stop the build rather than be reported.
      - name: Critical-path coverage amputation, every row applied
        run: |
          bash scripts/ci-harness-gate.sh check-critical-coverage-amputation.sh \
            --anchors-applied --min-rows 20 --row-re '^########## A[0-9]+ '

      # ----- U9, HTTP transport hardening (§7.2, §4.4) -----
      # WIRED IN THE MERGE COMMIT, and this unit needs it more than any other:
      # the plan records that NO §8 case owns U9, so nothing in the coupling
      # gate notices if one of its tests is deleted. U9's two steps - this one
      # and the amputation, now in its own lane - are the only thing standing
      # between that and a silent regression.
      #
      # THIS PARAGRAPH USED TO SAY the amputation takes ~13 minutes, is the
      # slowest step in this file, and is "left in the same job deliberately"
      # so a reader could not take a fast green as the answer. ALL THREE HAVE
      # BEEN FALSE FOR SOME TIME. Read from run 33629034552's own payload: the
      # amputation is 201s, not ~780s; the slowest step in this file is
      # `U3 audit amputation` at 304s; and the two U9 steps were ALREADY split
      # across two jobs before this rebalance touched them, so the co-location
      # the paragraph defends had already gone. It is corrected here rather
      # than deleted because the reasoning it records - that a job's green is
      # only worth what its slowest member proves - is still the reason these
      # lanes are packed by duration and not by unit.
      - name: U9 HTTP hardening controls, all fired
        run: bash scripts/ci-harness-gate.sh check-u9-http-controls.sh --controls-fired

      - name: Body cap amputation, every row applied
        run: |
          bash scripts/ci-harness-gate.sh check-body-cap-amputation.sh \
            --amputation --min-rows 5 --row-re '^########## [A-E]\. '

      # `--anchors-applied` ADDED BY #120. Its census asked, of every harness
      # printing a tally, whether any gate reads it. These three printed
      # `ROWS: N   ANCHORS APPLIED: M` and no step read it, while their five
      # siblings' steps did - a difference nothing had decided, produced by the
      # steps being written at different times. The tally was never decorative:
      # each harness gates on it internally and exits 3 or 1, and each prints a
      # vocabulary phrase the gate already greps for. What was missing is the
      # SECOND, INDEPENDENT layer the other five have, which is what catches a
      # harness whose own comparison is deleted. It costs nothing to add and it
      # is the answer #120's Q2 reached for these three.
      - name: U7 resilience amputation, every row applied
        run: |
          bash scripts/ci-harness-gate.sh check-u7-resilience-amputation.sh \
            --amputation --anchors-applied --min-rows 22 --row-re '^########## A[0-9]+ '

      # U5's controls. The mutation harness gates on every row firing; the
      # amputation harness gates on every row having APPLIED ITS ANCHOR.
      - name: U5 jobs controls, all fired
        run: bash scripts/ci-harness-gate.sh check-u5-jobs-controls.sh --controls-fired

      # ----- U6, base-agnostic offset paging (DESIGN.md §4.5, "Every scan starts at `start=0`") -----
      # WIRED IN THE SAME COMMIT AS THE MERGE, because a harness that runs
      # nowhere is not a control - the fifth instance of that shape recorded in
      # this file. U6 delivered both harnesses green and neither had a step.
      #
      # THREE OF U6'S ROWS DID NOT PASS FIRST TIME AND ALL THREE WERE REAL
      # DEFECTS IN ITS OWN TESTS, which is what these steps exist to keep
      # finding: M8's named case compared a recomputed total against a last page
      # of one and agreed by coincidence; M9's second arm was a capped call that
      # FILLS its limit, so it never reached a short page and the `not
      # exhaustive` condition it was meant to pin was doing nothing; and A7 was
      # VACUOUS because the final truncation still returned 50 records, so
      # nothing could tell a capped call that STOPS from one that pages the
      # whole resource and throws the rest away. A7's missing assertion was the
      # request COUNT.
      - name: U6 paging controls, all fired
        run: bash scripts/ci-harness-gate.sh check-u6-paging-controls.sh --controls-fired

      # ----- U8, candidate reads (§8 #5, #6, #19, #20, #24) -----
      # WIRED IN THE MERGE COMMIT. U8's own A1 row is why these steps matter
      # more than most: with the tool amputated to return an empty page,
      # EXACTLY 4 OF 56 ASSERTIONS GO RED AND 52 SURVIVE. The plan predicted
      # that and told U8 to write the positive control first; the row turns the
      # prediction into a standing experiment, so a future edit that makes the
      # tool return nothing is caught by the four rather than missed by the 52.
      - name: U8 candidate controls, all fired
        run: |
          bash scripts/ci-harness-gate.sh check-u8-candidates-controls.sh \
            --controls-fired --min-rows 25 --row-re '^########## M[0-9]+ '

      # ----- U7, resilience: timeout, retry, breaker (DESIGN.md §4.3 Resilience) -----
      # WIRED IN THE MERGE COMMIT, like U6's. A harness that runs nowhere is not
      # a control, and this is the unit DESIGN.md's never-executed-mechanisms list names as one of two
      # mechanisms NEVER EXECUTED - sitting among measured results and borrowing
      # their credibility. These two steps are what stops it drifting back there.
      #
      # The row regex comes from the harness's own shape, not from a preference:
      # the amputation harness declines to amputate two behaviours whose deletion
      # makes the scan loop forever, so its row count is not the number of
      # behaviours it covers and the floor has to be stated.
      #
      # R12-H2: `--min-rows` WAS 19 AGAINST 22 LIVE ROWS - three rows deletable
      # with this step green. The harness grew from 19 to 22 after the step was
      # wired, and `--min-rows` is a LOWER bound, so nothing said anything. 22 is
      # READ OFF A RUN (`grep -cE '^########## A[0-9]+ '` over the harness's own
      # output, exit 0), not 19 plus three. check-row-floor-exactness.py now
      # compares every `--min-rows` to a live count, so this cannot drift again.
      - name: U7 resilience controls, all fired
        run: bash scripts/ci-harness-gate.sh check-u7-resilience-controls.sh --controls-fired

      # ----- U12, get_job_feed - the one route whose URL is a secret -----
      # WIRED IN THE MERGE COMMIT. C5-I1 is a High and its arms are the reason
      # these steps exist: U12's absence assertion is paired with a PRESENCE
      # assertion on the same captured stream, including on httpx2's stdlib
      # line - the third producer and the only one that handles the whole URL.
      # An absence alone cannot tell "redacted" from "httpx2 logged nothing".
      #
      # Row M16 (the redactor's parameter set emptied) is the row this harness
      # exists for and it kills the C5-I1 arm. M17 (the set NARROWED to {"sc"})
      # SURVIVED on the first run, because the only producer that could leak
      # the api key was reaching the test by accident of test ORDERING - the
      # fixture now configures logging itself, and M17 then died.
      - name: U12 job feed controls, all fired
        run: |
          bash scripts/ci-harness-gate.sh check-u12-jobfeed-controls.sh \
            --controls-fired --min-rows 17 --row-re '^########## M[0-9]+ '

      - name: U4 client mutation controls, all killed
        run: bash scripts/ci-harness-gate.sh check-u4-client-controls.sh --result-killed

      - name: U6 paging amputation, every anchor applied
        run: bash scripts/ci-harness-gate.sh check-u6-paging-amputation.sh --anchors-applied

      - name: U9 HTTP hardening amputation, every row applied
        run: |
          bash scripts/ci-harness-gate.sh check-u9-http-amputation.sh \
            --amputation --anchors-applied --min-rows 14 --row-re '^########## A[0-9]+ '

      - name: U10 write amputation, every row applied
        run: |
          bash scripts/ci-harness-gate.sh check-u10-write-amputation.sh \
            --amputation --anchors-applied --min-rows 10 --row-re '^########## A[0-9]+ '

      # NOT ROUTED THROUGH ci-harness-gate.sh, deliberately: that takes a
      # bare harness NAME under scripts/, so a docs/reviews path resolves
      # to scripts/docs/reviews/... and exits 2. It prints its own
      # "controls fired: N passed, M failed" and exits 1 on any failure,
      # 2 on zero arms, so it needs no --min-rows.
      - name: Stranded-mutation control
        run: bash docs/reviews/control-stranded-mutation.sh

      # The guard that floors the suite size is itself a thing that can silently
      # stop working, and it would fail in exactly the way it exists to catch:
      # quietly, with everything green. `--require` is what checks it put back
      # the script it mutated.
      - name: Suite-floor guard amputation, every row killed
        run: "bash scripts/ci-harness-gate.sh check-suite-floor-amputation.sh --amputation --result-killed --require 'post-run re-check of the real script: exit=0'"

      # ---- U1's block. Neither U1 harness had a CI step at all, so every row
      # in them - including the ones that existed before this commit - ran only
      # when somebody remembered. That is the same defect the U3 comment below
      # names, and adding rows to an unrun harness would have been building it
      # a third time.
      - name: U1 boot mutation controls, all fired
        run: bash scripts/ci-harness-gate.sh check-u1-boot-controls.sh --controls-fired

      - name: U5 jobs amputation, every anchor applied
        run: bash scripts/ci-harness-gate.sh check-u5-jobs-amputation.sh --anchors-applied

      # THROUGH THE GATE SINCE #120, and the inline block it replaces was here
      # for a reason that turned out to be FALSE. #120 first left this step
      # inline, reasoning from the SOURCE that this harness prints
      # anchor-failure vocabulary as part of passing - `DID NOT LAND` and
      # `ANCHOR NOT UNIQUE` are both in it - and that `ci-harness-gate.sh` would
      # therefore fail it for doing its job. Measured instead of assumed, on a
      # real passing run: it prints NEITHER. The phrases are in its source and
      # never reach its output, which is the exact distinction the gate's
      # derive-then-grep design is built on, and reading the source alone is how
      # you get it backwards. Its sibling `ci-harness-gate-controls.sh` DOES
      # print both, so it stays inline below and this one does not.
      #
      # Wrapping it adds the second, independent layer: the inline form read only
      # the exit code, so a harness whose own `FIRED -ne TOTAL` comparison was
      # deleted would have passed. Run before wiring: exit 0,
      # `fired=9/9`, tree clean.
      - name: Harness anchor checker controls, all fired
        run: bash scripts/ci-harness-gate.sh check-harness-anchors-controls.sh --controls-fired

      - name: U1 boot amputation harness ran every row
        run: bash scripts/ci-harness-gate.sh check-u1-boot-amputation.sh --amputation --min-rows 14 --row-re '^########## [A-N]\. '

      - name: U8 candidate amputation, every row applied
        run: |
          bash scripts/ci-harness-gate.sh check-u8-candidates-amputation.sh \
            --amputation --anchors-applied --min-rows 14 --row-re '^########## A[0-9]+ '

      - name: U11 advisory controls, all fired
        run: bash scripts/ci-harness-gate.sh check-u11-advisory-controls.sh --controls-fired

      # The mirror-liveness checker's logic: five distinct exit codes plus three
      # amputations, every row fed INJECTED JSON so no row reaches the network.
      # That offline discipline is deliberate and it has a stated blind spot -
      # a fixture-fed row builds no URL, so none of these could see that the
      # first live call used the workflow's PATH where the API takes its FILE
      # NAME, and 404'd. The live call is its own step in the static-gates job;
      # this one covers what the live call cannot exercise on a healthy repo,
      # which is every state except "alive".
      - name: Mirror liveness controls, all fired
        run: bash scripts/ci-harness-gate.sh check-mirror-liveness-controls.sh --controls-fired

      # The gate every step below calls, exercised against stub harnesses that
      # replay recorded output. Twenty-three rows, every arm including the ones
      # a healthy repository never produces: a moved anchor with exit 0, a hung
      # row, a harness with no anchor vocabulary at all.
      - name: Harness gate controls, all fired
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # was unreachable, and the step exited with the checker's raw
          # code. Measured: bash -e exits 2 and prints nothing; without
          # -e the branch runs. This line is what makes `rc` reachable.
          set +e
          out=$(bash scripts/ci-harness-gate-controls.sh 2>&1); rc=$?
          echo "$out"
          [ "$rc" -eq 0 ] || { echo "::error::a harness-gate control did not fire"; exit 1; }

      # ----- U10, the write: approval guard and create_candidate -----
      # THE ONLY UNIT WHOSE FAILURE MODE EMAILS A LIVING PERSON, so these two
      # steps guard more than a schema. Row M2 is the one to read: it empties
      # the handshake era set so every handshake call refuses, and EVERY refusal
      # arm still passes against that tree - only the approved-write positive
      # control goes red. That is DESIGN.md §8's guard-that-refuses-
      # everything reproduced deliberately and killed, and it is why the row
      # counter had to be written before any source existed.
      - name: U10 write controls, all fired
        run: bash scripts/ci-harness-gate.sh check-u10-write-controls.sh --controls-fired

      # U0's tests assert properties about the manifest, the marker config and the
      # committed tree. Every one of them would pass against an absent file or a
      # search that matched nothing, so each is mutation-tested: the harness breaks
      # one thing at a time in a COPY of the tree and requires the named test to go
      # red. Same "all fired, never a literal count" rule as the design controls.
      #
      # NOTE: this harness mutates with `sed -i` expressions rather than literal
      # anchors. The checker read none of them until shape D landed - it NAMED
      # the harness as an unread mechanism rather than reporting a clean zero,
      # which is why that gap was a task and not an incident. It now contributes
      # 11 of the 164 anchors, and found a dead expression in one of them on its
      # first run.
      - name: U0 test controls, all fired
        run: bash scripts/ci-harness-gate.sh check-u0-test-controls.sh --controls-fired

      # THE TWO HARNESSES THAT RAN NOWHERE. U3 found these (D3): neither
      # scripts/check-u15-gate-amputation.sh nor scripts/check-u11-advisory-controls.sh
      # appeared in this workflow OR in CONTRIBUTING.md - `grep -c` returned 0 in all
      # four combinations. Both PASS today; the finding is that nothing would notice
      # if they stopped. That is the FOURTH instance of this shape here, after the
      # obligations map, the file-type gate's `--all` mode, and the plan-measurements
      # harness. A control that is not wired is not a control.
      #
      # AND THE U15 AMPUTATION HARNESS COULD NOT REPORT A MOVED ANCHOR AT ALL
      # (task #29). It amputates with `re.sub`, which returns the string
      # unchanged and raises nothing when it matches nothing - so a row would
      # run against an INTACT tree and publish a survivor list of false
      # findings, and no step could gate on it because it printed no phrase for
      # a step to gate on. Both of its rows now assert that the amputation
      # landed, D asserting its three tables separately.
      - name: U15 gate amputation, every row applied
        run: bash scripts/ci-harness-gate.sh check-u15-gate-amputation.sh --amputation

      # ---- U3's block. §4's rule: one unit, one non-adjacent block, nothing
      # else touched. Both harnesses run here, because a control that runs only
      # by hand is the defect this repository has already built twice
      # (IMPLEMENTATION-PLAN.md:1388's OBLIGATIONS row, and the `--all`
      # file-type mode that had no CI step one artifact later).
      - name: U3 audit mutation controls, all killed
        run: bash scripts/ci-harness-gate.sh check-u3-audit-controls.sh --result-killed

      # ----- ADR-0029 / DESIGN.md §2.1's 1 MiB max request body: the cap at the ASGI seat -----
      # Row counts DERIVED from the harnesses' own ROW_FLOOR (12 and 5), each
      # set from a run. NOTE the amputation's rows are LETTERED `A.` to `E.`,
      # not `A1`..`A5`, so the usual `--row-re '^########## A[0-9]+ '` would
      # match ZERO rows and fail the step for the wrong reason - the trap R7
      # flagged on U9. The regex below matches what this harness prints.
      - name: Body cap controls, all fired
        run: |
          bash scripts/ci-harness-gate.sh check-body-cap-controls.sh \
            --controls-fired --min-rows 12 --row-re '^########## M[0-9]+ '

      - name: U15 gate controls, all fired
        run: bash scripts/ci-harness-gate.sh check-u15-gate-controls.sh --controls-fired

      # ----- U14, the argument layer: the sweep over the input models -----
      # U14 MERGED WITH BOTH HARNESSES UNWIRED. They existed, they passed, and
      # nothing ran them - a green nobody asked for. Found by enumerating the
      # harness directory against this file rather than reading the merge.
      #
      # Row counts DERIVED: both were run at f2447ed in a dedicated worktree
      # and reported "20/20 controls fired" and "ROWS: 10 ANCHORS APPLIED: 10,
      # VACUOUS ROWS: 0".
      - name: U14 argument sweep controls, all fired
        run: |
          bash scripts/ci-harness-gate.sh check-u14-arguments-controls.sh \
            --controls-fired --min-rows 20 --row-re '^########## M[0-9]+ '

      # R12-H2: `--min-rows` WAS 10 AGAINST 16 LIVE ROWS - SIX rows deletable
      # with this step green, the largest slack in the file. U14 shipped 10 rows
      # at 8e5da82 and 481c682 added A11-A16 without touching this line, which is
      # the same merge-produced slack that once put u7's CONTROLS at 26 v 31.
      # 16 is READ OFF A RUN - the harness's own closing line says
      # `########## ROWS: 16   ANCHORS APPLIED: 16` - not 10 plus six.
      - name: U14 argument sweep amputation, every row applied
        run: |
          bash scripts/ci-harness-gate.sh check-u14-arguments-amputation.sh \
            --amputation --anchors-applied --min-rows 16 --row-re '^########## A[0-9]+ '

      # ----- ADR-0026: the embedder's log-redaction install -----
      # Row counts DERIVED: the harness declares ROW_FLOOR=6 internally and
      # its six rows were run at c54dc72. A3 is the one to read - it points
      # the filter at `"httpx"`, which is the name ADR-0026 itself used three
      # times before the correction, and the library logs on `httpx2`.
      - name: Log redaction amputation, every row applied
        run: |
          bash scripts/ci-harness-gate.sh check-log-redaction-amputation.sh \
            --amputation --anchors-applied --min-rows 6 --row-re '^########## A[0-9]+ '

      # ----- the wiring checker's own amputation probe (#149 M-4) -----
      #
      # LAST IN THIS JOB, AND THE POSITION IS LOAD-BEARING. These two arms
      # `git add -f` a fixture into the index and remove it in a `finally`,
      # and SIGKILL runs no `finally` - which is why the old shape gave them
      # a job of their own rather than a seat beside other steps. Running
      # them after every harness answers the same objection a different way:
      # no later step reads this index, so a stranded fixture can mislead
      # nothing. Their SUBJECT - `check-checkers-are-wired.py` - runs in the
      # `static-gates` job, so the original 'cannot share a job with its
      # subject' rule is still honoured, by separation rather than by
      # a job boundary.
      # git needs an identity before `git add` will run in a fresh checkout on
      # some configurations, and the probe stages a fixture. Setting it here
      # keeps the failure from looking like a probe fault.
      - name: The probe's arms all still fire
        run: |
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          uv run --frozen python docs/reviews/probe-wired-checker-amputation.py || exit 1

      # THE STEP ABOVE HAS A FLOOR AND NOBODY HAD WATCHED IT FIRE (#194).
      # `check-row-floor-controls.sh` cannot: it neutralises a row in bash
      # and reads a bash library's canonical line, so an arm there would
      # measure the interpreter. This is the same remedy the row-floor
      # container itself uses one job over - the harness arms its OWN floor.
      #
      # It runs SEPARATELY rather than being chained onto the line above:
      # under `bash -e` only the LAST command of an `&&` list triggers
      # errexit, so a chained self-test failure would be invisible. That
      # shape has hidden a red on this project three times.
      #
      # Every arm is in-process and touches nothing - no fixture, no index -
      # which is why it can share this job with the run it is about.
      - name: That probe's own floor still fires
        run: uv run --frozen python docs/reviews/probe-wired-checker-amputation.py --self-test || exit 1

      # THE HAZARD SERIALISING CREATES, CLOSED IN THE SAME CHANGE THAT CREATES
      # IT. Twelve jobs meant twelve disposable checkouts: a harness killed
      # mid-row left its mutation in a tree nothing else would ever read. One
      # job means one tree, and every step after the casualty runs against the
      # mutated source - a green that proves nothing, or a red pointing at an
      # innocent harness. `scripts/ci-harness-gate.sh` already re-checks its own
      # subject per invocation; this is the whole-lane assertion that no
      # invocation is the one that does not.
      - name: The serial lane left no mutation in src or tests
        run: |
          STRAY="$RUNNER_TEMP/assurance-stray-$GITHUB_RUN_ID.txt"
          git status --porcelain -- src tests > "$STRAY"
          if [ -s "$STRAY" ]; then
            echo "::error::a harness in this lane left the tree modified. Every"
            echo "::error::step after it ran against mutated source."
            cat "$STRAY"
            exit 1
          fi
          echo "src and tests are byte-identical to the checkout:"
          echo "no harness in this lane stranded a mutation."
